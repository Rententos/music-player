<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Music</title>
<style>
  :root {
    --bg1: #0f141b;
    --bg2: #182230;
    --text: #ffffff;
    --glass-opacity: 0.12;
  }
  body.light {
    --bg1: #e9eef3;
    --bg2: #f5f7fa;
    --text: #0f1318;
  }
  body {
    margin:0; font-family:system-ui,sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1));
    color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    transition:background .35s ease, color .35s ease;
  }
  .glass {
    background: rgba(255,255,255,var(--glass-opacity));
    border-radius:14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
    transition: background .3s ease;
  }
  /* Controls */
  #controls {
    margin-top:80px; width:80%; max-width:600px;
    text-align:center; padding:20px;
  }
  #controls input {
    padding:8px; border-radius:10px; border:none; margin:5px;
  }
  #controls button {
    padding:10px; border-radius:12px; border:none; margin:5px;
    cursor:pointer; background:rgba(255,255,255,0.15);
    color:inherit; transition:background .2s, transform .2s;
    font-size:20px;
  }
  #controls button:hover {background:rgba(255,255,255,0.3); transform:scale(1.1);}
  /* Settings icon */
  #settingsIcon {
    position:fixed; top:20px; right:20px;
    width:48px; height:48px; display:grid; place-items:center;
    cursor:pointer; font-size:22px;
  }
  /* Settings panel */
  #settingsPanel {
    position:fixed; top:80px; right:20px;
    width:260px; overflow:hidden;
    max-height:0; opacity:0;
    transition:max-height .6s ease, opacity .4s ease, padding .3s ease;
    padding:0;
  }
  #settingsPanel.open {
    max-height:300px; opacity:1; padding:16px;
  }
  #settingsPanel h3 {margin-top:0;}
  .slider {width:100%;}
  /* Playlist */
  #library {
    margin-top:20px; width:80%; max-width:600px; padding:12px;
  }
  #playlist li {
    margin:6px 0; padding:8px;
    border-radius:10px;
    cursor:pointer;
  }
  #playlist li:hover {background:rgba(255,255,255,0.15);}
</style>
</head>
<body>
  <!-- Settings icon -->
  <div id="settingsIcon" class="glass">⚙️</div>
  <!-- Settings panel -->
  <div id="settingsPanel" class="glass">
    <h3>Настройки</h3>
    <button id="themeToggle">🌗 Сменить тему</button>
    <label>Прозрачность стекла:
      <input type="range" id="opacitySlider" class="slider" min="0.05" max="0.3" step="0.01" value="0.12">
    </label>
  </div>

  <!-- Player controls -->
  <div id="controls" class="glass">
    <audio id="audio" controls></audio><br>
    <input type="text" id="trackTitle" placeholder="Название">
    <input type="text" id="trackUrl" placeholder="Ссылка на mp3">
    <button id="addBtn">➕</button>
    <button id="playPauseBtn">⏯</button>
    <button id="sleepBtn">⏱</button>
    <button id="clearBtn">🗑</button>
  </div>

  <!-- Playlist -->
  <div id="library" class="glass">
    <h2>📚 Библиотека</h2>
    <ul id="playlist"></ul>
  </div>

<script>
let playlist = loadPlaylist();
const audio = document.getElementById("audio");
const playlistEl = document.getElementById("playlist");
let sleepTimer;

/* Render playlist */
function renderPlaylist(){
  playlistEl.innerHTML="";
  playlist.forEach((track,index)=>{
    const li=document.createElement("li");
    li.className="glass";
    li.textContent=track.title;
    li.onclick=()=>playTrack(index);
    playlistEl.appendChild(li);
  });
}

/* Player functions */
function savePlaylist(){localStorage.setItem("myPlaylist",JSON.stringify(playlist));}
function loadPlaylist(){const d=localStorage.getItem("myPlaylist");return d?JSON.parse(d):[];}
function addTrack(){
  const title=document.getElementById("trackTitle").value.trim();
  const url=document.getElementById("trackUrl").value.trim();
  if(title&&url){
    playlist.push({title,url});
    savePlaylist(); renderPlaylist();
    document.getElementById("trackTitle").value="";
    document.getElementById("trackUrl").value="";
  }
}
function playTrack(index){audio.src=playlist[index].url; audio.play();}
function togglePlayPause(){audio.paused?audio.play():audio.pause();}
function setSleepTimer(){
  clearTimeout(sleepTimer);
  sleepTimer=setTimeout(()=>{audio.pause();alert("⏱️ Таймер сна: стоп");},60000);
}
function clearPlaylist(){playlist=[];savePlaylist();renderPlaylist();}

/* Settings logic */
const settingsIcon=document.getElementById("settingsIcon");
const settingsPanel=document.getElementById("settingsPanel");
settingsIcon.addEventListener("click",()=>settingsPanel.classList.toggle("open"));

document.getElementById("themeToggle").addEventListener("click",()=>{
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
});
document.getElementById("opacitySlider").addEventListener("input",(e)=>{
  document.documentElement.style.setProperty("--glass-opacity", e.target.value);
  localStorage.setItem("opacity", e.target.value);
});

/* Restore settings instantly */
window.addEventListener("DOMContentLoaded",()=>{
  const theme=localStorage.getItem("theme");
  if(theme==="light") document.body.classList.add("light");
  const op=localStorage.getItem("opacity");
  if(op) document.documentElement.style.setProperty("--glass-opacity", op);
  renderPlaylist();
});

/* Register player buttons */
document.getElementById("addBtn").addEventListener("click", addTrack);
document.getElementById("playPauseBtn").addEventListener("click", togglePlayPause);
document.getElementById("sleepBtn").addEventListener("click", setSleepTimer);
document.getElementById("clearBtn").addEventListener("click", clearPlaylist);
</script>
</body>
</html>
