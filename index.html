
 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Liquid Glass Player + Voice (Persistent)</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #1a1a1a, #2e2e2e);
      font-family: 'Segoe UI', sans-serif; color: #fff; transition: background 1s, color 0.5s;
    }
    body.light { background: linear-gradient(135deg, #f0f0f0, #dcdcdc); color: #000; }

    .theme-toggle, .voice-toggle {
      position: absolute; top: 20px; background: rgba(255,255,255,0.2);
      border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; color: inherit; transition: 0.3s;
    }
    .theme-toggle { right: 20px; }
    .voice-toggle  { left: 20px; }
    .theme-toggle:hover, .voice-toggle:hover { background: rgba(255,255,255,0.4); }

    .player {
      width: 380px; padding: 20px; border-radius: 25px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center;
      transition: background 0.5s;
    }

    .cover img { width: 220px; height: 220px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); object-fit: cover; }
    .track-info { text-align: center; margin: 15px 0; }
    .track-info h2 { margin: 0; font-size: 20px; }
    .track-info p { margin: 0; font-size: 14px; opacity: 0.8; }

    .controls { display: flex; gap: 20px; margin: 15px 0; }
    .btn {
      background: rgba(255,255,255,0.15); border: none; border-radius: 50%;
      width: 50px; height: 50px; font-size: 20px; color: inherit; cursor: pointer; transition: 0.3s;
    }
    .btn:hover { background: rgba(255,255,255,0.3); }
    .play { width: 65px; height: 65px; font-size: 24px; }
    .play.active { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%{transform:scale(1);box-shadow:0 0 0 rgba(255,255,255,0.4);}50%{transform:scale(1.1);box-shadow:0 0 20px rgba(255,255,255,0.6);}100%{transform:scale(1);box-shadow:0 0 0 rgba(255,255,255,0.4);} }

    .progress { display: flex; align-items: center; gap: 10px; width: 100%; }
    .progress input[type="range"] { flex: 1; accent-color: #ffcc00; }
    .time { font-size: 12px; opacity: 0.7; }

    .extra { display: flex; gap: 15px; margin-top: 15px; }
    .volume { display: flex; align-items: center; gap: 10px; margin-top: 10px; width: 100%; }
    .volume input[type="range"] { flex: 1; accent-color: #ffcc00; }

    .equalizer { display: flex; gap: 4px; margin-top: 15px; opacity: 0.3; transition: 0.3s; }
    .equalizer span { width: 6px; height: 20px; background: #ffcc00; animation: bounce 1s infinite; }
    .equalizer span:nth-child(2){animation-delay:0.2s;} .equalizer span:nth-child(3){animation-delay:0.4s;} .equalizer span:nth-child(4){animation-delay:0.6s;}
    @keyframes bounce {0%,100%{height:10px;}50%{height:25px;}}

    .playlist { margin-top: 15px; width: 100%; }
    .playlist ul { list-style: none; padding: 0; margin: 0; }
    .playlist li {
      padding: 8px; cursor: pointer; border-radius: 8px; transition: 0.3s; background: rgba(255,255,255,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .playlist li:hover { background: rgba(255,255,255,0.3); }
    .playlist li.active { background: #ffcc00; color: #000; }

    .file-input { margin-top: 15px; text-align: center; }
    .small { font-size: 12px; opacity: .7; }

    .voice-indicator { margin-top: 10px; font-size: 12px; opacity: 0.8; }
    .listening { color: #ffcc00; }

    .restore-tip { margin-top: 10px; font-size: 12px; opacity: 0.85; text-align: center; }
  </style>
</head>
<body>
  <button class="theme-toggle" title="Сменить тему">🌗 Тема</button>
  <button class="voice-toggle" title="Голосовой режим">🎙️ Голос</button>

  <div class="player">
    <div class="cover"><img id="cover" src="cover.jpg" alt="Обложка"></div>
    <div class="track-info">
      <h2 id="track-title">Название трека</h2>
      <p id="track-artist">Исполнитель</p>
    </div>
    <div class="controls">
      <button class="btn prev" title="Предыдущий">⏮</button>
      <button class="btn play" title="Воспроизвести">▶️</button>
      <button class="btn next" title="Следующий">⏭</button>
    </div>
    <div class="progress">
      <span class="time current">0:00</span>
      <input type="range" min="0" max="100" value="0" class="seek">
      <span class="time duration">0:00</span>
    </div>
    <div class="extra">
      <button class="btn like" title="Избранное">❤️</button>
      <button class="btn shuffle" title="Случайный порядок">🔀</button>
      <button class="btn repeat" title="Повтор">🔁</button>
    </div>
    <div class="volume">
      <span class="small">Громкость</span>
      <input type="range" min="0" max="1" step="0.01" value="1" class="volume-control">
    </div>
    <div class="equalizer"><span></span><span></span><span></span><span></span></div>

    <div class="playlist">
      <ul id="playlist"></ul>
    </div>
    <div class="file-input">
      <input type="file" id="filePicker" accept="audio/mp3,audio/*" multiple>
      <div class="small">Выберите один или несколько файлов</div>
    </div>

    <div class="voice-indicator" id="voiceIndicator">Голос: ожидание</div>
    <div class="restore-tip" id="restoreTip"></div>
  </div>

  <audio id="audio"></audio>

  <script>
    // Элементы
    const audio = document.getElementById('audio');
    const playBtn = document.querySelector('.play');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const seek = document.querySelector('.seek');
    const currentTimeEl = document.querySelector('.current');
    const durationEl = document.querySelector('.duration');
    const filePicker = document.getElementById('filePicker');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const coverImg = document.getElementById('cover');
    const playlistEl = document.getElementById('playlist');
    const volumeControl = document.querySelector('.volume-control');
    const equalizer = document.querySelector('.equalizer');
    const shuffleBtn = document.querySelector('.shuffle');
    const repeatBtn = document.querySelector('.repeat');
    const themeToggle = document.querySelector('.theme-toggle');
    const voiceToggle = document.querySelector('.voice-toggle');
    const voiceIndicator = document.getElementById('voiceIndicator');
    const restoreTip = document.getElementById('restoreTip');

    // Состояния
    let playlist = [];         // [{name, url, fileHandle?, fileName}]
    let currentIndex = -1;
    let shuffle = false;
    let repeat = 'none';       // 'none' | 'one' | 'all'
    let voiceEnabled = false;
    let restoring = false;

    // ====== ПЕРСИСТЕНТНОСТЬ ======
    const STORAGE_KEY = 'liquid-player-state';

    function saveState() {
      try {
        const state = {
          themeLight: document.body.classList.contains('light'),
          volume: audio.volume,
          shuffle,
          repeat,
          playlist: playlist.map(p => ({
            name: p.name || p.fileName,
            fileName: p.fileName || p.name,
            // fileHandle не сериализуем в localStorage — сохраним через File System Access отдельно
          })),
          currentIndex,
          currentTime: audio.currentTime,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    async function restoreState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const state = JSON.parse(raw);
        // Тема, громкость, режимы
        document.body.classList.toggle('light', !!state.themeLight);
        audio.volume = typeof state.volume === 'number' ? state.volume : 1;
        volumeControl.value = audio.volume;
        shuffle = !!state.shuffle;
        repeat = state.repeat || 'none';
        shuffleBtn.style.background = shuffle ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.15)';
        const map = { none: '🔁', all: '🔂', one: '🔁1' };
        repeatBtn.textContent = map[repeat];
        repeatBtn.style.background = repeat === 'none' ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.5)';

        // Восстановление плейлиста
        playlist = (state.playlist || []).map(p => ({ name: p.name, fileName: p.fileName }));
        renderPlaylist();

        currentIndex = typeof state.currentIndex === 'number' ? state.currentIndex : 0;

        // Попытка восстановить файлы через File System Access API
        if ('showOpenFilePicker' in window && state.playlist?.length) {
          restoring = true;
          restoreTip.innerHTML = 'Для полного восстановления треков нажмите: <b>Выбрать файлы</b> и укажите те же файлы. Я сопоставлю их по имени.';
        } else if (state.playlist?.length) {
          restoreTip.textContent = 'Выберите те же файлы — плейлист будет сопоставлен по имени.';
        }

        // Задаём заглушки интерфейса
        trackTitle.textContent = playlist[currentIndex]?.name || '—';
        trackArtist.textContent = '—';
        coverImg.src = 'cover.jpg';

        // Текущая позиция (установим после загрузки реальных файлов)
        if (typeof state.currentTime === 'number') {
          audio.addEventListener('loadedmetadata', () => {
            audio.currentTime = Math.min(state.currentTime, audio.duration || state.currentTime);
          }, { once: true });
        }
      } catch {}
    }

    // Сохраняем при ключевых событиях
    window.addEventListener('beforeunload', saveState);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });

    // ====== БАЗОВОЕ УПРАВЛЕНИЕ ======
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      saveState();
    });

    // Горячие клавиши
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0); }
      if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(audio.currentTime - 5, 0); }
    });

    playBtn.addEventListener('click', togglePlay);
    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) { audio.play(); playBtn.classList.add('active'); playBtn.textContent = '⏸️'; equalizer.style.opacity = 1; }
      else { audio.pause(); playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3; }
      saveState();
    }

    prevBtn.addEventListener('click', playPrev);
    nextBtn.addEventListener('click', playNext);

    function playPrev() {
      if (!playlist.length) return;
      currentIndex = shuffle ? randomIndex(currentIndex) : (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex, true);
    }
    function playNext() {
      if (!playlist.length) return;
      currentIndex = shuffle ? randomIndex(currentIndex) : (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex, true);
    }
    function randomIndex(except) {
      if (playlist.length <= 1) return 0;
      let idx; do { idx = Math.floor(Math.random() * playlist.length); } while (idx === except);
      return idx;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration); seek.value = 0;
    });
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        seek.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });
    audio.addEventListener('ended', () => {
      if (repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
      if (shuffle) { currentIndex = randomIndex(currentIndex); loadTrack(currentIndex, true); return; }
      if (repeat === 'all') { currentIndex = (currentIndex + 1) % playlist.length; loadTrack(currentIndex, true); return; }
      playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3;
      saveState();
    });

    seek.addEventListener('input', () => {
      if (!audio.duration) return; audio.currentTime = (seek.value / 100) * audio.duration;
    });
    seek.addEventListener('change', saveState);

    volumeControl.addEventListener('input', () => { audio.volume = parseFloat(volumeControl.value); });
    volumeControl.addEventListener('change', saveState);
    audio.volume = parseFloat(volumeControl.value);

    shuffleBtn.addEventListener('click', () => {
      shuffle = !shuffle;
      shuffleBtn.style.background = shuffle ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.15)';
      speak(shuffle ? 'Перемешивание включено' : 'Перемешивание выключено');
      saveState();
    });

    repeatBtn.addEventListener('click', () => {
      repeat = repeat === 'none' ? 'all' : repeat === 'all' ? 'one' : 'none';
      const map = { none: '🔁', all: '🔂', one: '🔁1' };
      repeatBtn.textContent = map[repeat];
      repeatBtn.style.background = repeat === 'none' ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.5)';
      speak(repeat === 'none' ? 'Повтор выключен' : repeat === 'all' ? 'Повтор всех' : 'Повтор одного');
      saveState();
    });

    // Загрузка файлов
    filePicker.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      // Если восстанавливаем — сопоставляем по имени
      if (restoring && playlist.length) {
        const byName = new Map(files.map(f => [f.name, f]));
        playlist = playlist.map(item => {
          const f = byName.get(item.fileName || item.name);
          if (f) return { name: item.name, fileName: f.name, url: URL.createObjectURL(f), file: f };
          return item; // без файла останется placeholder
        });
        restoring = false;
        restoreTip.textContent = '';
      } else {
        playlist = files.map(f => ({ name: f.name, fileName: f.name, url: URL.createObjectURL(f), file: f }));
      }

      renderPlaylist();
      currentIndex = 0;
      await loadTrack(currentIndex, true);
      saveState();
    });

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      playlist.forEach((item, idx) => {
        const li = document.createElement('li');
        const label = item.name || item.fileName || `Трек ${idx+1}`;
        li.innerHTML = `<span>${label}</span><span class="small">${idx+1}/${playlist.length}</span>`;
        li.addEventListener('click', () => { currentIndex = idx; loadTrack(currentIndex, true); saveState(); });
        if (idx === currentIndex) li.classList.add('active');
        playlistEl.appendChild(li);
      });
    }

    async function loadTrack(index, autoplay = false) {
      const item = playlist[index]; if (!item) return;
      if (!item.url && item.file) item.url = URL.createObjectURL(item.file);
      audio.src = item.url || '';
      trackTitle.textContent = item.name || item.fileName || '—';
      trackArtist.textContent = '—';

      [...playlistEl.children].forEach((li, i) => li.classList.toggle('active', i === index));

      await setCoverFromFile(item.file);
      try { const colors = await extractDominantColors(coverImg); setDynamicBackground(colors); }
      catch { setDynamicBackground([{r:255,g:204,b:0},{r:46,g:46,b:46}]); }

      if (autoplay && audio.src) { audio.play(); playBtn.classList.add('active'); playBtn.textContent = '⏸️'; equalizer.style.opacity = 1; }
      else { playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3; }

      saveState();
      speak(`Трек ${index+1} выбран`);
    }

    async function setCoverFromFile(file) {
      coverImg.src = 'cover.jpg'; if (!file) return;
      if (file.type.startsWith('image/')) { coverImg.src = URL.createObjectURL(file); return; }
      coverImg.onerror = () => (coverImg.src = 'cover.jpg');
    }

    function extractDominantColors(imgEl) {
      return new Promise((resolve, reject) => {
        const img = new Image(); img.crossOrigin = 'anonymous'; img.src = imgEl.src;
        img.onload = () => {
          const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
          const w = canvas.width = 64, h = canvas.height = 64; ctx.drawImage(img, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h).data;
          let r=0,g=0,b=0,count=0; for (let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; }
          r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
          const cr = 255 - r, cg = 255 - g, cb = 255 - b; resolve([{r,g,b},{r:cr,g:cg,b:cb}]);
        };
        img.onerror = reject;
      });
    }

    function setDynamicBackground(colors){
      const [c1, c2] = colors;
      const g1 = `rgb(${c1.r},${c1.g},${c1.b})`;
      const g2 = `rgb(${c2.r},${c2.g},${c2.b})`;
      document.body.style.background = `linear-gradient(135deg, ${g1}, ${g2})`;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60) || 0;
      const s = Math.floor(sec % 60) || 0;
      return `${m}:${s.toString().padStart(2,'0')}`;
    }

    // ===== Голосовой помощник (ASR + TTS) =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    voiceToggle.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceToggle.style.background = voiceEnabled ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)';
      voiceIndicator.textContent = voiceEnabled ? 'Голос: включён' : 'Голос: ожидание';
      if (voiceEnabled) startListening(); else stopListening();
    });

    let recognition;
    function startListening() {
      if (!SpeechRecognition) { speak('Распознавание речи не поддерживается в этом браузере'); return; }
      if (recognition) stopListening();
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.interimResults = false;
      recognition.continuous = true;

      recognition.onstart = () => voiceIndicator.innerHTML = '<span class="listening">Голос: слушаю…</span>';
      recognition.onend = () => { if (voiceEnabled) recognition.start(); else voiceIndicator.textContent = 'Голос: ожидание'; };
      recognition.onerror = () => { voiceIndicator.textContent = 'Голос: ошибка'; };

      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).pop()[0].transcript.trim().toLowerCase();
        voiceIndicator.textContent = `Голос: "${transcript}"`;
        handleVoiceCommand(transcript);
      };

      recognition.start();
    }

    function stopListening() {
      if (recognition) { recognition.onend = null; recognition.stop(); recognition = null; }
      voiceIndicator.textContent = 'Голос: ожидание';
    }

    function speak(text) {
      if (!synth) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      synth.speak(utter);
    }

    function handleVoiceCommand(cmd) {
      const num = (cmd.match(/\d+/) ? parseInt(cmd.match(/\d+/)[0], 10) : null);

      if (/(пауза|стоп)/.test(cmd)) { audio.pause(); playBtn.classList.remove('active'); playBtn.textContent='▶️'; equalizer.style.opacity = 0.3; speak('Пауза'); saveState(); return; }
      if (/(воспроизведи|проиграй|продолжи|запусти)/.test(cmd)) {
        if (!audio.src && playlist.length){ loadTrack(0,true); }
        else { audio.play(); playBtn.classList.add('active'); playBtn.textContent='⏸️'; equalizer.style.opacity = 1; }
        speak('Воспроизведение'); saveState(); return;
      }

      if (/следующ(ий|е)/.test(cmd)) { playNext(); speak('Следующий трек'); saveState(); return; }
      if (/предыдущ(ий|е)/.test(cmd)) { playPrev(); speak('Предыдущий трек'); saveState(); return; }

      if (/(громче|увеличь громкость)/.test(cmd)) { audio.volume = Math.min(1, audio.volume + 0.1); volumeControl.value = audio.volume; speak(`Громкость ${Math.round(audio.volume*100)} процентов`); saveState(); return; }
      if (/(тише|уменьш(и|ь) громкость)/.test(cmd)) { audio.volume = Math.max(0, audio.volume - 0.1); volumeControl.value = audio.volume; speak(`Громкость ${Math.round(audio.volume*100)} процентов`); saveState(); return; }
      if (/громк(ость)? \d+/.test(cmd) && num !== null) { const v = Math.max(0, Math.min(1, num/100)); audio.volume = v; volumeControl.value = v; speak(`Громкость ${num} процентов`); saveState(); return; }

      if (/(перемотай|перемотка|перемотать|вперёд)/.test(cmd) && num) { audio.currentTime = Math.min(audio.currentTime + num, audio.duration || 0); speak(`Вперёд на ${num} секунд`); saveState(); return; }
      if (/(назад|отмотай)/.test(cmd) && num) { audio.currentTime = Math.max(audio.currentTime - num, 0); speak(`Назад на ${num} секунд`); saveState(); return; }

      if (/(перемешивание|перемешай|shuffle) включ(и|ить)/.test(cmd)) { shuffle = true; shuffleBtn.style.background='rgba(255,255,255,0.5)'; speak('Перемешивание включено'); saveState(); return; }
      if (/(перемешивание|shuffle) выключ(и|ить)/.test(cmd)) { shuffle = false; shuffleBtn.style.background='rgba(255,255,255,0.15)'; speak('Перемешивание выключено'); saveState(); return; }

      if (/повтор (все|всё|all)/.test(cmd)) { repeat='all'; repeatBtn.textContent='🔂'; repeatBtn.style.background='rgba(255,255,255,0.5)'; speak('Повтор всех треков'); saveState(); return; }
      if (/повтор (один|one|трек)/.test(cmd)) { repeat='one'; repeatBtn.textContent='🔁1'; repeatBtn.style.background='rgba(255,255,255,0.5)'; speak('Повтор одного трека'); saveState(); return; }
      if (/повтор выключ(и|ить)/.test(cmd)) { repeat='none'; repeatBtn.textContent='🔁'; repeatBtn.style.background='rgba(255,255,255,0.15)'; speak('Повтор выключен'); saveState(); return; }

      if (/трек номер \d+/.test(cmd) && num) { const idx = Math.max(1, Math.min(playlist.length, num)) - 1; currentIndex = idx; loadTrack(currentIndex, true); speak(`Воспроизвожу трек номер ${num}`); saveState(); return; }

      if (/(помощь|что ты умеешь)/.test(cmd)) {
        speak('Я могу управлять воспроизведением, громкостью, перемоткой, перемешиванием и повтором. Скажи: воспроизведи или пауза.');
        return;
      }

      speak('Команда не распознана');
    }

    // ==== Инициализация ====
    restoreState();
  </script>
