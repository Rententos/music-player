<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музыкальная Библиотека — Liquid Glass</title>
<style>
  body {
    margin:0; font-family:system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1b2733, #0f141b);
    color:#fff; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  .glass {
    background:rgba(255,255,255,0.08);
    border-radius:14px;
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
  }
  /* Библиотека */
  #library {
    position:fixed; top:20px; left:20px;
    width:240px; max-height:70vh; overflow-y:auto;
    padding:12px;
  }
  #library h2 {margin:0 0 10px; font-size:18px;}
  .genre-block {margin-bottom:12px;}
  .genre-title {font-weight:bold; margin-bottom:6px;}
  .track {margin:6px 0; padding:8px; border-radius:10px;}
  .track:hover {background:rgba(255,255,255,0.15);}
  .eq-icon {cursor:pointer; margin-left:6px;}
  .eq-panel {
    max-height:0; overflow:hidden;
    transition:max-height 0.5s ease, padding 0.3s ease;
    background:rgba(255,255,255,0.12);
    border-radius:12px; margin-top:6px; padding:0 10px;
  }
  .eq-panel.open {max-height:200px; padding:10px;}
  .eq-option {padding:6px; margin:4px 0; border-radius:8px; background:rgba(255,255,255,0.15); cursor:pointer;}
  .eq-option:hover {background:rgba(255,255,255,0.25);}
  /* Плеер */
  #controls {margin-top:100px; width:80%; max-width:600px; text-align:center; padding:20px;}
  #controls input {padding:8px; border-radius:10px; border:none; margin:5px;}
  #controls button {
    padding:10px; border-radius:12px; border:none; margin:5px;
    cursor:pointer; background:rgba(255,255,255,0.12); color:inherit;
    transition:background 0.2s, transform 0.2s;
    font-size:20px;
  }
  #controls button:hover {background:rgba(255,255,255,0.25); transform:scale(1.1);}
  #fileUpload {margin-top:20px; padding:15px; text-align:center;}
</style>
</head>
<body>
  <!-- Библиотека -->
  <div id="library" class="glass">
    <h2>📚 Библиотека</h2>
    <div id="genres"></div>
  </div>

  <!-- Центр — плеер -->
  <div id="controls" class="glass">
    <audio id="audio" controls></audio><br>
    <input type="text" id="trackTitle" placeholder="Название">
    <input type="text" id="trackUrl" placeholder="Ссылка">
    <input type="text" id="trackGenre" placeholder="Жанр">
    <button onclick="addTrack()">➕</button>
    <button onclick="toggleTheme()">🌗</button>
    <button onclick="setSleepTimer()">⏱</button>
    <button onclick="clearPlaylist()">🗑</button>
    <button onclick="togglePlayPause()">⏯</button>
  </div>

  <!-- Загрузка файла -->
  <div id="fileUpload" class="glass">
    <input type="file" id="fileInput" accept="audio/*">
    <button onclick="addTrackFile()">📂</button>
  </div>

<script>
let playlist = loadPlaylist();
const audio = document.getElementById("audio");
let sleepTimer;

renderLibrary();

function savePlaylist(){localStorage.setItem("myPlaylist",JSON.stringify(playlist));}
function loadPlaylist(){const d=localStorage.getItem("myPlaylist");return d?JSON.parse(d):[];}

function addTrack(){
  const title=document.getElementById("trackTitle").value.trim();
  const url=document.getElementById("trackUrl").value.trim();
  const genre=document.getElementById("trackGenre").value.trim()||"Разное";
  if(title&&url){
    playlist.push({title,url,genre});
    savePlaylist(); renderLibrary();
    document.getElementById("trackTitle").value="";
    document.getElementById("trackUrl").value="";
    document.getElementById("trackGenre").value="";
  }
}
function addTrackFile(){
  const file=document.getElementById("fileInput").files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  playlist.push({title:file.name,url,genre:"Локальные"});
  savePlaylist(); renderLibrary();
  document.getElementById("fileInput").value="";
}
function playTrack(url){audio.src=url; audio.play();}
function togglePlayPause(){audio.paused?audio.play():audio.pause();}
function toggleTheme(){document.body.classList.toggle("light");}
function setSleepTimer(){
  clearTimeout(sleepTimer);
  sleepTimer=setTimeout(()=>{audio.pause();alert("⏱️ Таймер сна: стоп");},60000);
}
function clearPlaylist(){playlist=[];savePlaylist();renderLibrary();}

function renderLibrary(){
  const genresEl=document.getElementById("genres");
  genresEl.innerHTML="";
  // группировка по жанрам
  const grouped={};
  playlist.forEach(t=>{
    if(!grouped[t.genre]) grouped[t.genre]=[];
    grouped[t.genre].push(t);
  });
  // сортировка жанров и треков
  Object.keys(grouped).sort().forEach(genre=>{
    const block=document.createElement("div");
    block.className="genre-block";
    const title=document.createElement("div");
    title.className="genre-title";
    title.textContent=genre;
    block.appendChild(title);
    grouped[genre].sort((a,b)=>a.title.localeCompare(b.title)).forEach((track,i)=>{
      const li=document.createElement("div");
      li.className="track glass";
      li.textContent=track.title;
      li.onclick=()=>playTrack(track.url);
      const eqIcon=document.createElement("span");
      eqIcon.className="eq-icon";
      eqIcon.textContent="🎚";
      eqIcon.onclick=(e)=>{e.stopPropagation();toggleEq(track.title+genre+i);};
      const eqPanel=document.createElement("div");
      eqPanel.className="eq-panel";
      eqPanel.id="eq-"+track.title+genre+i;
      ["Бас","Тре́бл","Вокал","Эхо"].forEach(opt=>{
        const div=document.createElement("div");
        div.className="eq-option";
        div.textContent=opt;
        eqPanel.appendChild(div);
      });
      li.appendChild(eqIcon);
      li.appendChild(eqPanel);
      block.appendChild(li);
    });
    genresEl.appendChild(block);
  });
}
function toggleEq(id){
  const panel=document.getElementById("eq-"+id);
  if(panel) panel.classList.toggle("open");
}
</script>
</body>
</html>
