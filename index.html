<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Музыкальная Библиотека — Liquid Glass</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1b2733, #0f141b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Liquid Glass Card */
    .glass {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    /* Библиотека слева сверху */
    #library {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 220px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 12px;
    }
    #library h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }
    #library ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #library li {
      background: rgba(255,255,255,0.1);
      margin: 6px 0;
      padding: 8px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    #library li:hover { background: rgba(255,255,255,0.2); }
    .eq-icon {
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
    }
    /* Эквалайзер капля */
    .eq-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease, padding 0.3s ease;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      margin-top: 6px;
      padding: 0 10px;
    }
    .eq-panel.open {
      max-height: 200px;
      padding: 10px;
    }
    .eq-option {
      padding: 6px;
      margin: 4px 0;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      transition: background 0.2s;
    }
    .eq-option:hover { background: rgba(255,255,255,0.25); }
    /* Центр — инструменты плеера */
    #controls {
      margin: auto;
      width: 80%;
      max-width: 600px;
      text-align: center;
      padding: 20px;
    }
    #controls input {
      padding: 8px;
      border-radius: 10px;
      border: none;
      margin: 5px;
    }
    #controls button {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      margin: 5px;
      cursor: pointer;
      background: rgba(255,255,255,0.15);
      color: inherit;
      transition: background 0.2s, transform 0.2s;
    }
    #controls button:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Библиотека -->
  <div id="library" class="glass">
    <h2>📚 Библиотека</h2>
    <ul id="playlist"></ul>
  </div>

  <!-- Центр — инструменты -->
  <div id="controls" class="glass">
    <audio id="audio" controls></audio><br>
    <input type="text" id="trackTitle" placeholder="Название трека">
    <input type="text" id="trackUrl" placeholder="Ссылка на mp3">
    <button onclick="addTrack()">Добавить трек</button>
    <button onclick="toggleTheme()">Сменить тему</button>
    <button onclick="setSleepTimer()">Таймер сна</button>
  </div>

  <script>
    let playlist = loadPlaylist();
    const audio = document.getElementById("audio");
    const playlistEl = document.getElementById("playlist");
    let sleepTimer;

    renderPlaylist();

    function savePlaylist() {
      localStorage.setItem("myPlaylist", JSON.stringify(playlist));
    }
    function loadPlaylist() {
      const data = localStorage.getItem("myPlaylist");
      return data ? JSON.parse(data) : [];
    }

    function addTrack() {
      const title = document.getElementById("trackTitle").value.trim();
      const url = document.getElementById("trackUrl").value.trim();
      if (title && url) {
        playlist.push({ title, url });
        savePlaylist();
        renderPlaylist();
        document.getElementById("trackTitle").value = "";
        document.getElementById("trackUrl").value = "";
      }
    }

    function playTrack(index) {
      audio.src = playlist[index].url;
      audio.play();
    }

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      playlist.forEach((track, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${track.title}</span>
          <span class="eq-icon" onclick="toggleEq(${index})">🎚</span>
        `;
        li.onclick = () => playTrack(index);

        const eqPanel = document.createElement("div");
        eqPanel.className = "eq-panel";
        eqPanel.id = "eq-" + index;
        ["Бас", "Тре́бл", "Вокал", "Эхо"].forEach(opt => {
          const div = document.createElement("div");
          div.className = "eq-option";
          div.textContent = opt;
          eqPanel.appendChild(div);
        });

        li.appendChild(eqPanel);
        playlistEl.appendChild(li);
      });
    }

    function toggleEq(index) {
      const panel = document.getElementById("eq-" + index);
      panel.classList.toggle("open");
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    function setSleepTimer() {
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(() => {
        audio.pause();
        alert("⏱️ Таймер сна: воспроизведение остановлено");
      }, 60000);
    }
  </script>
</body>
</html>
