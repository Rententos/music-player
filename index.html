<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liquid Glass Music — Roman</title>
  <meta name="theme-color" content="#0f141b" />
  <style>
    /* ===== Theme variables ===== */
    :root {
      --bg1: #0f141b;
      --bg2: #172130;
      --text: #ffffff;
      --muted: #b7c0cc;
      --accent: #4cafef;
      --accent-2: #7fd1ff;
      --glass-opacity: 0.10; /* более прозрачный по умолчанию */
      --glass-border: 0.14;
      --shadow-outer: 0 30px 80px rgba(0,0,0,0.40);
      --shadow-inner: inset 0 1px 0 rgba(255,255,255,0.10);
    }
    body.light {
      --bg1: #e9eef3;
      --bg2: #f5f7fa;
      --text: #0f1318;
      --muted: #4a596b;
      --accent: #225a8a;
      --accent-2: #3b78a8;
      --glass-opacity: 0.10;
      --glass-border: 0.18;
      --shadow-outer: 0 30px 80px rgba(0,0,0,0.22);
      --shadow-inner: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    /* ===== Base ===== */
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 800px at 25% 15%, var(--bg2) 0%, var(--bg1) 45%, #0b1016 100%);
      transition: background .35s ease, color .35s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    @media (prefers-reduced-motion: reduce) { *{transition:none !important; animation:none !important;} }

    /* ===== Liquid Glass ===== */
    .glass {
      background: rgba(255,255,255,var(--glass-opacity));
      border: 1px solid rgba(255,255,255,var(--glass-border));
      border-radius: 16px;
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      box-shadow: var(--shadow-outer), var(--shadow-inner);
      transition: background .25s ease, border-color .25s ease;
    }
    .glass-strong {
      background: rgba(255,255,255,calc(var(--glass-opacity)+0.04));
      border: 1px solid rgba(255,255,255,var(--glass-border));
      border-radius: 12px;
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      box-shadow: 0 22px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* ===== Layout (как на картинке №1) ===== */
    .app {
      width: min(1100px, 94vw);
      height: min(720px, 92vh);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    /* Верх: три стеклянные кнопки */
    .top-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .top-btn {
      height: 56px;
      display: grid;
      place-items: center;
      font-size: 22px;
      cursor: pointer;
      border-radius: 16px;
    }
    .top-btn:hover { border-color: var(--accent-2); transform: translateY(-1px); }

    /* Средний ряд: слева Библиотека, справа Настройки */
    .mid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 0;
    }
    .panel {
      padding: 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-height: 0;
    }
    .panel-title { font-weight: 700; letter-spacing: .2px; }

    .library-list {
      overflow: auto;
      padding: 8px;
      border-radius: 12px;
    }
    .track-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      margin:6px 0;
      border-radius:12px;
      cursor:pointer;
      transition: transform .12s ease, border-color .2s ease, background .2s ease;
    }
    .track-item:hover { transform: translateY(-1px); border-color: var(--accent-2); }
    .track-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-tools { display:flex; align-items:center; gap:8px; }

    /* Эквалайзер — капля под треком */
    .eq-toggle { cursor: pointer; }
    .eq-panel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height .45s ease, opacity .35s ease, padding .25s ease;
      margin-top: 6px;
      padding: 0 10px;
    }
    .eq-panel.open { max-height: 180px; opacity: 1; padding: 10px; }
    .eq-option {
      padding: 8px;
      margin: 6px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s ease;
    }
    .eq-option:hover { background: rgba(255,255,255,0.16); }

    /* Нижний ряд: центральная панель управления */
    .controls-panel {
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 12px;
    }
    .audio-bar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 10px;
    }
    .progress {
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .1s linear;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .ctrl-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 20px;
      cursor: pointer;
      border-radius: 14px;
      transition: transform .12s ease, border-color .2s ease, background .2s ease;
    }
    .ctrl-btn:hover { transform: translateY(-1px); border-color: var(--accent-2); }

    /* Инпуты — компактные */
    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .inputs input[type="text"],
    .inputs input[type="file"] {
      padding: 10px 12px;
      border-radius: 12px;
      outline: none;
    }
    .inputs input::placeholder { color: var(--muted); }

    /* Настройки — капля */
    .settings-inner { display: grid; gap: 10px; }
    .set-btn {
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .12s ease, border-color .2s ease, background .2s ease;
    }
    .set-btn:hover { transform: translateY(-1px); border-color: var(--accent-2); }
    .slider { width: 100%; }

    /* Применение стекла к нужным блокам */
    .use-glass { /* утилита для нужных элементов */
      background: rgba(255,255,255,var(--glass-opacity));
      border: 1px solid rgba(255,255,255,var(--glass-border));
      border-radius: 12px;
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      box-shadow: 0 22px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Responsive */
    @media (max-width: 960px) {
      .mid-row { grid-template-columns: 1fr; }
      .app { height: auto; }
      .inputs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Верх: три стеклянные кнопки -->
    <div class="top-actions">
      <div id="libBtn" class="glass top-btn" title="Библиотека">📚</div>
      <div id="eqBtn" class="glass top-btn" title="Эквалайзер">🎚</div>
      <div id="settingsBtn" class="glass top-btn" title="Настройки">⚙️</div>
    </div>

    <!-- Средний ряд -->
    <div class="mid-row">
      <!-- Библиотека -->
      <section class="glass panel">
        <div class="panel-title">Библиотека</div>
        <div id="libraryList" class="library-list glass-strong">
          <!-- Треки рендерятся скриптом -->
        </div>
      </section>

      <!-- Настройки -->
      <section class="glass panel">
        <div class="panel-title">Настройки</div>
        <div class="settings-inner">
          <button id="themeToggle" class="set-btn use-glass">🌗 Сменить тему</button>

          <label class="set-btn use-glass" style="display:grid; gap:8px;">
            <span>Прозрачность стекла</span>
            <input id="opacitySlider" class="slider" type="range" min="0.05" max="0.25" step="0.01" value="0.10" />
          </label>

          <!-- Ссылка на mp3 в настройках -->
          <div class="set-btn use-glass" style="display:grid; gap:8px;">
            <span style="font-weight:700;">Добавить трек по ссылке</span>
            <div class="inputs" style="grid-template-columns: 1fr;">
              <input id="urlTitle" class="use-glass" type="text" placeholder="Название трека" />
              <input id="urlInput" class="use-glass" type="url" placeholder="Ссылка на mp3 (https://…)" />
            </div>
            <button id="addByUrl" class="set-btn use-glass">➕ Добавить</button>
          </div>

          <!-- Загрузка файла -->
          <div class="set-btn use-glass" style="display:grid; gap:8px;">
            <span style="font-weight:700;">Добавить трек файлом</span>
            <input id="fileInput" class="use-glass" type="file" accept="audio/*" />
          </div>
        </div>
      </section>
    </div>

    <!-- Нижний ряд: панель управления -->
    <section class="glass controls-panel">
      <div class="audio-bar">
        <div id="prevBtn" class="ctrl-btn use-glass" title="Назад">⏮</div>
        <div class="progress use-glass"><div id="progressBar" class="bar"></div></div>
        <div id="nextBtn" class="ctrl-btn use-glass" title="Вперёд">⏭</div>
      </div>

      <div class="control-row">
        <div id="playPauseBtn" class="ctrl-btn use-glass" title="Плей/Пауза">⏯</div>
        <div id="sleepBtn" class="ctrl-btn use-glass" title="Сон 1 мин">⏱</div>
        <div id="clearBtn" class="ctrl-btn use-glass" title="Очистить библиотеку">🗑</div>
      </div>

      <div class="inputs">
        <input id="quickTitle" class="use-glass" type="text" placeholder="Название" />
        <input id="quickFile" class="use-glass" type="file" accept="audio/*" />
      </div>
    </section>
  </div>

  <!-- Два аудиоканала для безопасного кроссфейда -->
  <audio id="audioA" crossorigin="anonymous"></audio>
  <audio id="audioB" crossorigin="anonymous"></audio>

  <script>
    // ===== State =====
    const audioA = document.getElementById('audioA');
    const audioB = document.getElementById('audioB');
    let active = 'A';
    let sleepTimer = null;

    let tracks = load('lg_tracks') || sampleData();
    let currentIndex = -1;

    // ===== Elements =====
    const libraryListEl = document.getElementById('libraryList');
    const progressBar = document.getElementById('progressBar');

    // Top buttons
    const libBtn = document.getElementById('libBtn');
    const eqBtn = document.getElementById('eqBtn');
    const settingsBtn = document.getElementById('settingsBtn');

    // Settings
    const themeToggle = document.getElementById('themeToggle');
    const opacitySlider = document.getElementById('opacitySlider');
    const fileInput = document.getElementById('fileInput');
    const urlTitle = document.getElementById('urlTitle');
    const urlInput = document.getElementById('urlInput');
    const addByUrl = document.getElementById('addByUrl');

    // Controls
    const playPauseBtn = document.getElementById('playPauseBtn');
    const sleepBtn = document.getElementById('sleepBtn');
    const clearBtn = document.getElementById('clearBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quickTitle = document.getElementById('quickTitle');
    const quickFile = document.getElementById('quickFile');

    // ===== Utils =====
    function save(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
    function load(key){ try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
    function id(){ return Math.random().toString(36).slice(2,9); }
    function sampleData(){
      return [
        { id: id(), title: 'Glass Sunrise', url: 'https://www2.cs.uic.edu/~i101/SoundFiles/StarWars60.wav' },
        { id: id(), title: 'Liquid Night', url: 'https://www2.cs.uic.edu/~i101/SoundFiles/ImperialMarch60.wav' },
        { id: id(), title: 'Velvet Bass', url: 'https://www2.cs.uic.edu/~i101/SoundFiles/CantinaBand60.wav' }
      ];
    }

    // ===== Render =====
    function renderLibrary(){
      libraryListEl.innerHTML = '';
      tracks.forEach((t, idx) => {
        // строка трека
        const row = document.createElement('div');
        row.className = 'track-item use-glass';
        const title = document.createElement('div');
        title.className = 'track-title';
        title.textContent = t.title;

        const tools = document.createElement('div');
        tools.className = 'track-tools';

        const eqIcon = document.createElement('span');
        eqIcon.className = 'eq-toggle';
        eqIcon.textContent = '🎚';
        eqIcon.title = 'Эквалайзер';

        const playIcon = document.createElement('span');
        playIcon.textContent = '⏯';
        playIcon.title = 'Играть/Пауза';
        playIcon.style.cursor = 'pointer';

        tools.append(eqIcon, playIcon);
        row.append(title, tools);

        // Панель эквалайзера
        const eqPanel = document.createElement('div');
        eqPanel.className = 'eq-panel glass-strong';
        ['Бас','Тре́бл','Вокал','Эхо'].forEach(opt=>{
          const item = document.createElement('div');
          item.className = 'eq-option use-glass';
          item.textContent = opt;
          eqPanel.appendChild(item);
        });

        // События
        row.addEventListener('click', () => playIndex(idx));
        eqIcon.addEventListener('click', (e)=>{ e.stopPropagation(); eqPanel.classList.toggle('open'); });
        playIcon.addEventListener('click', (e)=>{ e.stopPropagation(); playIndex(idx); });

        libraryListEl.appendChild(row);
        libraryListEl.appendChild(eqPanel);
      });
    }

    // ===== Play logic with crossfade =====
    async function playIndex(idx){
      const t = tracks[idx]; if(!t) return;
      currentIndex = idx;

      const from = active === 'A' ? audioA : audioB;
      const to = active === 'A' ? audioB : audioA;

      try {
        to.src = t.url;
        to.volume = 0;
        await to.play();

        const step = 0.05, interval = 120;
        const fade = setInterval(() => {
          from.volume = Math.max(0, from.volume - step);
          to.volume = Math.min(1, to.volume + step);
          if (from.volume <= 0 && to.volume >= 1) {
            clearInterval(fade);
            from.pause();
            active = active === 'A' ? 'B' : 'A';
          }
        }, interval);
      } catch (err) {
        alert('Не удалось воспроизвести трек. Проверь ссылку/файл.');
        console.error(err);
      }
    }

    function togglePlayPause(){
      const a = active === 'A' ? audioA : audioB;
      if (a.src) { a.paused ? a.play() : a.pause(); }
      else if (tracks.length) { playIndex(0); }
    }

    function navigate(dir){
      if (currentIndex === -1) return;
      const next = Math.max(0, Math.min(tracks.length - 1, currentIndex + dir));
      playIndex(next);
    }

    // ===== Progress =====
    let progressTimer = null;
    function startProgress(){
      stopProgress();
      progressTimer = setInterval(()=>{
        const a = active === 'A' ? audioA : audioB;
        if (a.duration > 0) {
          progressBar.style.width = `${(a.currentTime / a.duration) * 100}%`;
        } else {
          progressBar.style.width = '0%';
        }
      }, 200);
    }
    function stopProgress(){ if (progressTimer) { clearInterval(progressTimer); progressTimer = null; } }
    audioA.addEventListener('play', startProgress);
    audioB.addEventListener('play', startProgress);
    audioA.addEventListener('pause', stopProgress);
    audioB.addEventListener('pause', stopProgress);

    // ===== Settings =====
    function applyTheme(theme){
      const isLight = theme === 'light';
      document.body.classList.toggle('light', isLight);
      localStorage.setItem('lg_theme', isLight ? 'light' : 'dark');
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f5f7fa' : '#0f141b');
    }
    function applyOpacity(val){
      const n = Number(val);
      const clamped = Math.min(0.35, Math.max(0.03, isNaN(n) ? 0.10 : n));
      document.documentElement.style.setProperty('--glass-opacity', clamped);
      localStorage.setItem('lg_opacity', String(clamped));
    }

    // ===== Add tracks =====
    function addFile(file){
      if (!file) return alert('Выберите аудиофайл.');
      const url = URL.createObjectURL(file);
      const baseTitle = file.name.replace(/\.(mp3|wav|ogg|m4a|flac)$/i, '');
      tracks.push({ id: id(), title: baseTitle || 'Без названия (локально)', url });
      save('lg_tracks', tracks);
      renderLibrary();
      // Не ревокаем сразу, пока трек в библиотеке; ревок при очистке
    }
    function addByLink(){
      const title = (urlTitle.value || '').trim();
      const url = (urlInput.value || '').trim();
      if (!title) return alert('Укажи название.');
      if (!/^https?:\/\/.+/i.test(url)) return alert('Ссылка должна начинаться с http:// или https://');
      tracks.push({ id: id(), title, url });
      save('lg_tracks', tracks);
      renderLibrary();
      urlTitle.value = ''; urlInput.value = '';
    }

    // ===== Init / Bind =====
    window.addEventListener('DOMContentLoaded', () => {
      // Restore theme & opacity
      applyTheme(load('lg_theme') || 'dark');
      const op = load('lg_opacity'); applyOpacity(op ?? 0.10); if (op) opacitySlider.value = op;

      renderLibrary();

      // Top buttons: легкая подсветка панелей
      libBtn.addEventListener('click', ()=> flashBorder(libraryListEl.parentElement));
      eqBtn.addEventListener('click', ()=> {
        document.querySelectorAll('.eq-panel.open').forEach(p=> flashBorder(p));
      });
      settingsBtn.addEventListener('click', ()=> {
        const rightPanel = document.querySelectorAll('.panel')[1];
        flashBorder(rightPanel);
      });

      // Settings controls
      themeToggle.addEventListener('click', ()=> applyTheme(document.body.classList.contains('light') ? 'dark' : 'light'));
      opacitySlider.addEventListener('input', (e)=> applyOpacity(e.target.value));
      fileInput.addEventListener('change', (e)=> addFile(e.target.files[0]));
      addByUrl.addEventListener('click', addByLink);

      // Player controls
      playPauseBtn.addEventListener('click', togglePlayPause);
      prevBtn.addEventListener('click', ()=> navigate(-1));
      nextBtn.addEventListener('click', ()=> navigate(1));
      sleepBtn.addEventListener('click', ()=> {
        clearTimeout(sleepTimer);
        sleepTimer = setTimeout(()=> { audioA.pause(); audioB.pause(); alert('⏱️ Таймер сна: воспроизведение остановлено'); }, 60_000);
        alert('Таймер сна установлен: 1 минута');
      });
      clearBtn.addEventListener('click', ()=> {
        if (!confirm('Очистить библиотеку?')) return;
        tracks.forEach(t => { if (t.url && t.url.startsWith('blob:')) { try { URL.revokeObjectURL(t.url); } catch {} } });
        tracks = [];
        save('lg_tracks', tracks);
        renderLibrary();
      });

      // Быстрое добавление: имя + файл (файл обязателен)
      quickFile.addEventListener('change', (e)=> {
        const file = e.target.files[0];
        if (!file) return;
        const name = quickTitle.value.trim();
        if (name) Object.defineProperty(file, 'name', { value: name + '.' + file.name.split('.').pop(), configurable: true });
        addFile(file);
        quickTitle.value=''; quickFile.value='';
      });

      // Hotkeys
      document.addEventListener('keydown',(e)=>{
        if (e.code === 'Space') { e.preventDefault(); togglePlayPause(); }
        else if (e.code === 'ArrowRight') { const a = active === 'A' ? audioA : audioB; a.currentTime += 5; }
        else if (e.code === 'ArrowLeft') { const a = active === 'A' ? audioA : audioB; a.currentTime -= 5; }
      });
    });

    // ===== Helpers =====
    function flashBorder(el){
      if (!el) return;
      const prev = el.style.borderColor;
      el.style.borderColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-2');
      setTimeout(()=> el.style.borderColor = prev || `rgba(255,255,255,var(--glass-border))`, 220);
    }
  </script>
</body>
</html>
