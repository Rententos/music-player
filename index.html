<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Моя Музыкальная Библиотека — Liquid Glass</title>
  <meta name="theme-color" content="#141a21" />
  <style>
    /* ===== Reset & base ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
      --bg1: #0e141b;
      --bg2: #1b2733;
      --glass: rgba(255,255,255,0.12);
      --glass-strong: rgba(255,255,255,0.2);
      --text: #ffffff;
      --accent: #4cafef;
      --accent-2: #7fd1ff;
    }
    body.light {
      --bg1: #e9eef3;
      --bg2: #f5f7fa;
      --glass: rgba(0,0,0,0.08);
      --glass-strong: rgba(0,0,0,0.16);
      --text: #0f1318;
      --accent: #225a8a;
      --accent-2: #3b78a8;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, var(--bg2) 0%, var(--bg1) 45%, #0a0f14 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      transition: background 0.4s ease, color 0.4s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    .container {
      width: min(1100px, 94vw);
      margin: 28px auto;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
    }
    h1 {
      margin: 0;
      padding: 8px 0 4px;
      text-align: center;
      letter-spacing: 0.3px;
      font-weight: 700;
      font-size: clamp(20px, 3vw, 28px);
    }
    /* ===== Liquid Glass Card ===== */
    .card {
      background: var(--glass);
      border-radius: 16px;
      backdrop-filter: saturate(140%) blur(16px);
      -webkit-backdrop-filter: saturate(140%) blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 30px 80px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }
    /* ===== Controls ===== */
    #controls {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: center;
      justify-items: center;
    }
    .inputs {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
    }
    input, button {
      font: inherit;
    }
    input {
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08));
      color: var(--text);
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.78); }
    body.light input::placeholder { color: rgba(0,0,0,0.55); }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.12));
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--accent-2); }
    .btn.primary {
      border-color: rgba(76,175,239,0.45);
      box-shadow: inset 0 0 0 1px rgba(76,175,239,0.35);
    }
    /* ===== Main grid ===== */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: start;
    }
    /* ===== Playlist ===== */
    #playlist.card { padding: 12px; }
    #playlist[aria-busy="true"] { opacity: 0.6; }
    #playlist li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin: 8px 0;
      border-radius: 14px;
      background: var(--glass-strong);
      border: 1px solid rgba(255,255,255,0.10);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      cursor: grab;
    }
    #playlist li:hover {
      transform: translateX(3px);
      border-color: rgba(255,255,255,0.18);
    }
    #playlist li.dragging { opacity: 0.5; cursor: grabbing; }
    .track-title {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 600;
    }
    .track-actions { display: flex; gap: 8px; }
    /* play/delete buttons inside track */
    .track-actions .btn { padding: 8px 12px; border-radius: 10px; }
    /* ===== Visualizer ===== */
    #visualizer.card {
      height: 300px;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }
    .bar {
      width: 9px;
      margin: 2px;
      border-radius: 6px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 6px 18px rgba(76,175,239,0.35);
      height: 24px;
      transition: height 0.12s ease;
    }
    /* ===== Responsive ===== */
    @media (max-width: 980px) {
      .main { grid-template-columns: 1fr; }
      #visualizer.card { height: 220px; }
      .inputs { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .inputs { grid-template-columns: 1fr; }
      .bar { width: 7px; }
      #visualizer.card { height: 180px; }
      #playlist li { grid-template-columns: 1fr; }
      .track-actions { justify-content: flex-start; }
    }
    /* ===== Focus visibility for accessibility ===== */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎶 Моя Музыкальная Библиотека</h1>

    <!-- Controls -->
    <section id="controls" class="card" role="region" aria-label="Управление">
      <!-- Two audio channels for safe crossfade -->
      <audio id="audioA" crossorigin="anonymous"></audio>
      <audio id="audioB" crossorigin="anonymous"></audio>

      <div class="inputs" role="form" aria-label="Добавить трек">
        <input id="trackTitle" type="text" placeholder="Название трека" aria-label="Название трека" />
        <input id="trackUrl" type="url" placeholder="Ссылка на mp3 (https://...)" aria-label="Ссылка на трек" />
        <button id="addBtn" class="btn primary" aria-label="Добавить трек">Добавить</button>
      </div>

      <div class="buttons" role="group" aria-label="Кнопки">
        <button id="playPauseBtn" class="btn" aria-label="Плей/Пауза">Плей/Пауза</button>
        <button id="themeBtn" class="btn" aria-label="Сменить тему">Тема</button>
        <button id="sleepBtn" class="btn" aria-label="Таймер сна 1 мин">Сон 1 мин</button>
        <button id="clearBtn" class="btn" aria-label="Очистить плейлист">Очистить</button>
        <button id="exportBtn" class="btn" aria-label="Экспорт плейлиста">Экспорт</button>
        <button id="importBtn" class="btn" aria-label="Импорт плейлиста">Импорт</button>
      </div>
    </section>

    <!-- Main: playlist + visualizer -->
    <section class="main">
      <ul id="playlist" class="card" role="list" aria-label="Список треков"></ul>
      <div id="visualizer" class="card" role="img" aria-label="Визуализатор"></div>
    </section>
  </div>

  <script>
    // ===== State =====
    const audioA = document.getElementById('audioA');
    const audioB = document.getElementById('audioB');
    let active = 'A';
    let sleepTimer = null;

    const playlistEl = document.getElementById('playlist');
    const visualizer = document.getElementById('visualizer');

    let playlist = loadPlaylist();
    applySavedTheme();
    renderPlaylist();
    setupControls();
    (window.requestIdleCallback || setTimeout)(initVisualizer, 0);

    // ===== Storage =====
    function savePlaylist() {
      localStorage.setItem('myPlaylist', JSON.stringify(playlist));
    }
    function loadPlaylist() {
      try {
        const data = localStorage.getItem('myPlaylist');
        return data ? JSON.parse(data) : [];
      } catch {
        return [];
      }
    }

    // ===== Theme =====
    function applySavedTheme() {
      const t = localStorage.getItem('theme');
      if (t === 'light') document.body.classList.add('light');
    }
    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    // ===== Add track =====
    function addTrack() {
      const titleEl = document.getElementById('trackTitle');
      const urlEl = document.getElementById('trackUrl');
      const title = titleEl.value.trim();
      const url = urlEl.value.trim();
      if (!title || !url) return alert('Укажи название и ссылку.');
      if (!/^https?:\/\//i.test(url)) return alert('Ссылка должна начинаться с http:// или https://');
      if (playlist.some(t => t.url === url)) return alert('Этот трек уже в плейлисте.');

      playlist.push({ title, url });
      savePlaylist();
      renderPlaylist();
      titleEl.value = '';
      urlEl.value = '';
    }

    // ===== Render playlist =====
    function renderPlaylist() {
      playlistEl.setAttribute('aria-busy', 'true');
      playlistEl.innerHTML = '';
      playlist.forEach((track, index) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.index = index;

        const title = document.createElement('span');
        title.className = 'track-title';
        title.textContent = track.title;

        const actions = document.createElement('div');
        actions.className = 'track-actions';

        const playBtn = document.createElement('button');
        playBtn.className = 'btn';
        playBtn.textContent = '▶️';
        playBtn.title = 'Играть';
        playBtn.onclick = () => playTrack(index);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn';
        delBtn.textContent = '🗑️';
        delBtn.title = 'Удалить';
        delBtn.onclick = () => {
          playlist.splice(index, 1);
          savePlaylist();
          renderPlaylist();
        };

        actions.append(playBtn, delBtn);
        li.append(title, actions);

        // Drag & drop
        li.addEventListener('dragstart', (e) => {
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', index.toString());
        });
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.addEventListener('dragover', (e) => {
          e.preventDefault();
          const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const toIndex = parseInt(li.dataset.index, 10);
          if (Number.isNaN(fromIndex) || Number.isNaN(toIndex)) return;
          if (fromIndex === toIndex) return;
          const rect = li.getBoundingClientRect();
          const after = e.clientY > rect.top + rect.height / 2;
          const fromEl = playlistEl.children[fromIndex];
          if (fromEl) playlistEl.insertBefore(fromEl, after ? li.nextSibling : li);
        });
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const toIndex = parseInt(li.dataset.index, 10);
          moveItem(fromIndex, toIndex);
        });

        playlistEl.appendChild(li);
      });
      playlistEl.removeAttribute('aria-busy');
      Array.from(playlistEl.children).forEach((child, idx) => child.dataset.index = idx);
    }

    function moveItem(from, to) {
      if (from === to || from < 0 || to < 0 || from >= playlist.length || to >= playlist.length) return;
      const item = playlist.splice(from, 1)[0];
      playlist.splice(to, 0, item);
      savePlaylist();
      renderPlaylist();
    }

    // ===== Play & crossfade =====
    async function playTrack(index) {
      const track = playlist[index];
      if (!track) return;

      const from = active === 'A' ? audioA : audioB;
      const to = active === 'A' ? audioB : audioA;

      try {
        to.src = track.url;
        to.volume = 0;
        await to.play();

        const step = 0.05;
        const interval = 120;
        const fade = setInterval(() => {
          from.volume = Math.max(0, from.volume - step);
          to.volume = Math.min(1, to.volume + step);
          if (from.volume <= 0 && to.volume >= 1) {
            clearInterval(fade);
            from.pause();
            active = active === 'A' ? 'B' : 'A';
          }
        }, interval);
      } catch (e) {
        alert('Не удалось проиграть трек. Проверь ссылку.');
      }
    }

    function currentAudio() { return active === 'A' ? audioA : audioB; }

    function togglePlayPause() {
      const a = currentAudio();
      if (a.src) {
        a.paused ? a.play() : a.pause();
      } else if (playlist.length) {
        playTrack(0);
      }
    }

    // ===== Sleep timer =====
    function setSleepTimer(ms) {
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(() => {
        audioA.pause(); audioB.pause();
        alert('⏱️ Таймер сна: воспроизведение остановлено');
      }, ms);
      alert('Таймер сна установлен');
    }

    // ===== Export/Import =====
    function exportPlaylist() {
      const blob = new Blob([JSON.stringify(playlist, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'playlist.json'; a.click();
      URL.revokeObjectURL(url);
    }
    async function importPlaylist() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = async () => {
        const file = input.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('Неверный формат');
          const cleaned = data.filter(t => t && t.title && t.url && /^https?:\/\//i.test(t.url));
          playlist = cleaned;
          savePlaylist();
          renderPlaylist();
          alert('Импорт завершён');
        } catch {
          alert('Ошибка импорта. Проверь файл.');
        }
      };
      input.click();
    }

    // ===== Controls & hotkeys =====
    function setupControls() {
      document.getElementById('addBtn').onclick = addTrack;
      document.getElementById('themeBtn').onclick = toggleTheme;
      document.getElementById('sleepBtn').onclick = () => setSleepTimer(60_000);
      document.getElementById('clearBtn').onclick = () => {
        if (confirm('Очистить плейлист?')) {
          playlist = []; savePlaylist(); renderPlaylist();
        }
      };
      document.getElementById('playPauseBtn').onclick = togglePlayPause;
      document.getElementById('exportBtn').onclick = exportPlaylist;
      document.getElementById('importBtn').onclick = importPlaylist;

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); togglePlayPause(); }
        else if (e.code === 'ArrowRight') { currentAudio().currentTime += 5; }
        else if (e.code === 'ArrowLeft') { currentAudio().currentTime -= 5; }
      });
    }

    // ===== Visualizer (adaptive) =====
    let resizeObserver;
    function initVisualizer() {
      visualizer.innerHTML = '';
      const barsCount = Math.floor(visualizer.clientWidth / 14);
      for (let i = 0; i < Math.max(28, barsCount); i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        visualizer.appendChild(bar);
      }
      const bars = Array.from(visualizer.querySelectorAll('.bar'));

      function animate() {
        const base = currentAudio();
        const amp = base.paused ? 0.18 : 1;
        for (let i = 0; i < bars.length; i++) {
          const r = Math.random() * amp;
          const h = 40 + r * (visualizer.clientHeight - 70);
          bars[i].style.height = Math.max(20, Math.min(visualizer.clientHeight - 20, h)) + 'px';
        }
        requestAnimationFrame(animate);
      }
      animate();

      if (resizeObserver) resizeObserver.disconnect();
      if ('ResizeObserver' in window) {
        resizeObserver = new ResizeObserver(debounce(initVisualizer, 200));
        resizeObserver.observe(visualizer);
      } else {
        window.addEventListener('resize', debounce(initVisualizer, 200));
      }
    }

    // ===== Debounce =====
    function debounce(fn, delay) {
      let t = null;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
    }
  </script>
</body>
</html>
