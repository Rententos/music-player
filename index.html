<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Player</title>
  <style>
    /* Фон в стиле Жидкое стекло */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a1a, #2e2e2e);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    /* Контейнер плеера */
    .player {
      width: 350px;
      padding: 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Обложка */
    .cover img {
      width: 220px;
      height: 220px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Инфо о треке */
    .track-info {
      text-align: center;
      margin: 15px 0;
    }
    .track-info h2 {
      margin: 0;
      font-size: 20px;
    }
    .track-info p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
    }

    /* Кнопки управления */
    .controls {
      display: flex;
      gap: 20px;
      margin: 15px 0;
    }
    .btn {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .play {
      width: 65px;
      height: 65px;
      font-size: 24px;
    }

    /* Прогресс */
    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .progress input[type="range"] {
      flex: 1;
      accent-color: #ffcc00; /* Яндекс акцент */
    }
    .time {
      font-size: 12px;
      opacity: 0.7;
    }

    /* Дополнительные кнопки */
    .extra {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="cover">
      <img src="cover.jpg" alt="Обложка трека">
    </div>
    <div class="track-info">
      <h2>Название трека</h2>
      <p>Исполнитель</p>
    </div>
    <div class="controls">
      <button class="btn">⏮</button>
      <button class="btn play">▶️</button>
      <button class="btn">⏭</button>
    </div>
    <div class="progress">
      <span class="time">0:00</span>
      <input type="range" min="0" max="100" value="30">
      <span class="time">3:45</span>
    </div>
    <div class="extra">
      <button class="btn">❤️</button>
      <button class="btn">🔀</button>
      <button class="btn">🔁</button>
    </div>
  </div>
</body>
</html>
