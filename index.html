<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Liquid Glass Player + Voice (Transcode)</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #1a1a1a, #2e2e2e);
      font-family: 'Segoe UI', sans-serif; color: #fff; transition: background 1s, color 0.5s;
    }
    body.light { background: linear-gradient(135deg, #f0f0f0, #dcdcdc); color: #000; }

    .theme-toggle, .voice-toggle {
      position: absolute; top: 20px; background: rgba(255,255,255,0.2);
      border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; color: inherit; transition: 0.3s;
    }
    .theme-toggle { right: 20px; }
    .voice-toggle  { left: 20px; }
    .theme-toggle:hover, .voice-toggle:hover { background: rgba(255,255,255,0.4); }

    .player {
      width: 440px; padding: 20px; border-radius: 25px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center;
      transition: background 0.5s;
    }

    .cover img { width: 240px; height: 240px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); object-fit: cover; }
    .track-info { text-align: center; margin: 15px 0; }
    .track-info h2 { margin: 0; font-size: 20px; }
    .track-info p { margin: 0; font-size: 14px; opacity: 0.8; }

    .controls { display: flex; gap: 20px; margin: 15px 0; }
    .btn {
      background: rgba(255,255,255,0.15); border: none; border-radius: 50%;
      width: 50px; height: 50px; font-size: 20px; color: inherit; cursor: pointer; transition: 0.3s;
    }
    .btn:hover { background: rgba(255,255,255,0.3); }
    .play { width: 65px; height: 65px; font-size: 24px; }
    .play.active { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%{transform:scale(1);box-shadow:0 0 0 rgba(255,255,255,0.4);}50%{transform:scale(1.1);box-shadow:0 0 20px rgba(255,255,255,0.6);}100%{transform:scale(1);box-shadow:0 0 0 rgba(255,255,255,0.4);} }

    .progress { display: flex; align-items: center; gap: 10px; width: 100%; }
    .progress input[type="range"] { flex: 1; accent-color: #ffcc00; }
    .time { font-size: 12px; opacity: 0.7; }

    .extra { display: flex; gap: 15px; margin-top: 15px; }

    .volume { display: flex; align-items: center; gap: 10px; margin-top: 10px; width: 100%; }
    .volume input[type="range"] { flex: 1; accent-color: #ffcc00; }

    .equalizer { display: flex; gap: 4px; margin-top: 15px; opacity: 0.3; transition: 0.3s; }
    .equalizer span { width: 6px; height: 20px; background: #ffcc00; animation: bounce 1s infinite; }
    .equalizer span:nth-child(2){animation-delay:0.2s;} .equalizer span:nth-child(3){animation-delay:0.4s;} .equalizer span:nth-child(4){animation-delay:0.6s;}
    @keyframes bounce {0%,100%{height:10px;}50%{height:25px;}}

    .playlist { margin-top: 15px; width: 100%; }
    .playlist ul { list-style: none; padding: 0; margin: 0; }
    .playlist li {
      padding: 8px; cursor: pointer; border-radius: 8px; transition: 0.3s; background: rgba(255,255,255,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .playlist li:hover { background: rgba(255,255,255,0.3); }
    .playlist li.active { background: #ffcc00; color: #000; }

    .file-input { margin-top: 15px; text-align: center; }
    .small { font-size: 12px; opacity: .7; }

    .voice-indicator { margin-top: 10px; font-size: 12px; opacity: 0.8; }
    .listening { color: #ffcc00; }

    .status { margin-top: 10px; font-size: 12px; opacity: .9; min-height: 16px; text-align: center; }
  </style>
</head>
<body>
  <button class="theme-toggle" title="Сменить тему">🌗 Тема</button>
  <button class="voice-toggle" title="Голосовой режим">🎙️ Голос</button>

  <div class="player">
    <div class="cover"><img id="cover" src="cover.jpg" alt="Обложка"></div>
    <div class="track-info">
      <h2 id="track-title">Название трека</h2>
      <p id="track-artist">Исполнитель</p>
    </div>
    <div class="controls">
      <button class="btn prev" title="Предыдущий">⏮</button>
      <button class="btn play" title="Воспроизвести">▶️</button>
      <button class="btn next" title="Следующий">⏭</button>
    </div>
    <div class="progress">
      <span class="time current">0:00</span>
      <input type="range" min="0" max="100" value="0" class="seek">
      <span class="time duration">0:00</span>
    </div>
    <div class="extra">
      <button class="btn like" title="Избранное">❤️</button>
      <button class="btn shuffle" title="Случайный порядок">🔀</button>
      <button class="btn repeat" title="Повтор">🔁</button>
    </div>
    <div class="volume">
      <span class="small">Громкость</span>
      <input type="range" min="0" max="1" step="0.01" value="1" class="volume-control">
    </div>
    <div class="equalizer"><span></span><span></span><span></span><span></span></div>

    <div class="playlist">
      <ul id="playlist"></ul>
    </div>
    <div class="file-input">
      <input type="file" id="filePicker" accept="*/*" multiple>
      <div class="small">Поддерживаются любые аудиоформаты — неподдерживаемые будут конвертироваться автоматически</div>
    </div>

    <div class="voice-indicator" id="voiceIndicator">Голос: ожидание</div>
    <div class="status" id="status"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <!-- FFmpeg.wasm для автотранскодирования -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

  <script>
    // Элементы
    const audio = document.getElementById('audio');
    const playBtn = document.querySelector('.play');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const seek = document.querySelector('.seek');
    const currentTimeEl = document.querySelector('.current');
    const durationEl = document.querySelector('.duration');
    const filePicker = document.getElementById('filePicker');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const coverImg = document.getElementById('cover');
    const playlistEl = document.getElementById('playlist');
    const volumeControl = document.querySelector('.volume-control');
    const equalizer = document.querySelector('.equalizer');
    const shuffleBtn = document.querySelector('.shuffle');
    const repeatBtn = document.querySelector('.repeat');
    const themeToggle = document.querySelector('.theme-toggle');
    const voiceToggle = document.querySelector('.voice-toggle');
    const voiceIndicator = document.getElementById('voiceIndicator');
    const statusEl = document.getElementById('status');

    // Состояния
    let playlist = []; let currentIndex = -1;
    let shuffle = false; let repeat = 'none';
    let voiceEnabled = false;

    // Тема
    themeToggle.addEventListener('click', () => { document.body.classList.toggle('light'); });

    // Горячие клавиши
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0); }
      if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(audio.currentTime - 5, 0); }
    });

    // ======= Автотранскодирование =======
    const { FFmpeg } = FFmpegWASM;
    const ffmpeg = new FFmpeg();

    let ffmpegReady = false;
    async function ensureFFmpeg() {
      if (ffmpegReady) return;
      setStatus('Загрузка конвертера…');
      await ffmpeg.load({
        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js',
        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.wasm'
      });
      ffmpegReady = true;
      setStatus('');
    }

    function canPlayFile(file) {
      // Если MIME известен и браузер его поддерживает как audio — ок
      const type = file.type || '';
      if (type.startsWith('audio/')) {
        const can = audio.canPlayType(type);
        if (can === 'probably' || can === 'maybe') return true;
      }
      // Если расширение стандартное — попробуем
      const name = file.name.toLowerCase();
      if (/\.(mp3|ogg|wav|aac|m4a|flac)$/i.test(name)) {
        // Браузер может не поддержать контейнер/кодек; будем проверять при воспроизведении
        return !!/\.(mp3|ogg|wav)$/i.test(name);
      }
      return false;
    }

    async function makePlayable(file) {
      // Если браузер может — используем оригинальный файл
      if (canPlayFile(file)) {
        return { blobUrl: URL.createObjectURL(file), format: 'original' };
      }
      // Иначе — транскодируем в WAV (pcm_s16le, 44.1kHz, стерео)
      await ensureFFmpeg();
      setStatus(`Конвертация: ${file.name}…`);
      const inputName = 'input_' + Date.now();
      const outputName = 'output_' + Date.now() + '.wav';

      const arrayBuffer = await file.arrayBuffer();
      await ffmpeg.writeFile(inputName, new Uint8Array(arrayBuffer));

      // -vn (без видео), PCM WAV, 44.1kHz, 2 канала
      await ffmpeg.exec(['-i', inputName, '-vn', '-acodec', 'pcm_s16le', '-ar', '44100', '-ac', '2', outputName]);

      const data = await ffmpeg.readFile(outputName);
      const blob = new Blob([data.buffer], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);

      // Очистка
      await ffmpeg.deleteFile(inputName).catch(()=>{});
      await ffmpeg.deleteFile(outputName).catch(()=>{});

      setStatus('');
      return { blobUrl: url, format: 'wav' };
    }

    // ======= Управление =======
    playBtn.addEventListener('click', togglePlay);
    async function togglePlay() {
      if (!audio.src) { setStatus('Нет трека. Выберите файлы.'); return; }
      audio.muted = false;
      audio.volume = Math.max(0.01, parseFloat(volumeControl.value||'1'));
      try {
        if (audio.paused) {
          await audio.play();
          playBtn.classList.add('active'); playBtn.textContent = '⏸️'; equalizer.style.opacity = 1;
          setStatus('');
        } else {
          audio.pause();
          playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3;
        }
      } catch (err) {
        setStatus('Нажмите ▶️ для старта (политика автоплея).');
        console.warn('Play error:', err);
      }
    }

    prevBtn.addEventListener('click', playPrev);
    nextBtn.addEventListener('click', playNext);
    function playPrev() {
      if (!playlist.length) return;
      currentIndex = shuffle ? randomIndex(currentIndex) : (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex, true);
    }
    function playNext() {
      if (!playlist.length) return;
      currentIndex = shuffle ? randomIndex(currentIndex) : (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex, true);
    }
    function randomIndex(except) {
      if (playlist.length <= 1) return 0;
      let idx; do { idx = Math.floor(Math.random() * playlist.length); } while (idx === except);
      return idx;
    }

    audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); seek.value = 0; });
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) { seek.value = (audio.currentTime / audio.duration) * 100; currentTimeEl.textContent = formatTime(audio.currentTime); }
    });
    audio.addEventListener('ended', () => {
      if (repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
      if (shuffle) { currentIndex = randomIndex(currentIndex); loadTrack(currentIndex, true); return; }
      if (repeat === 'all') { currentIndex = (currentIndex + 1) % playlist.length; loadTrack(currentIndex, true); return; }
      playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3;
    });

    seek.addEventListener('input', () => { if (!audio.duration) return; audio.currentTime = (seek.value / 100) * audio.duration; });

    volumeControl.addEventListener('input', () => {
      audio.volume = parseFloat(volumeControl.value);
      setStatus(audio.volume === 0 ? 'Громкость: 0 (без звука)' : '');
    });
    audio.volume = parseFloat(volumeControl.value);
    audio.muted = false;

    shuffleBtn.addEventListener('click', () => {
      shuffle = !shuffle;
      shuffleBtn.style.background = shuffle ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.15)';
    });
    repeatBtn.addEventListener('click', () => {
      repeat = repeat === 'none' ? 'all' : repeat === 'all' ? 'one' : 'none';
      repeatBtn.textContent = {none:'🔁',all:'🔂',one:'🔁1'}[repeat];
      repeatBtn.style.background = repeat === 'none' ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.5)';
    });

    // ======= Плейлист и загрузка файлов =======
    filePicker.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      setStatus('Подготовка треков…');
      playlist = [];
      // Последовательно готовим треки (можно распараллелить, но UI будет проще последовательно)
      for (const f of files) {
        const playable = await makePlayable(f);
        playlist.push({
          name: f.name + (playable.format === 'wav' ? ' (конвертировано)' : ''),
          originalName: f.name,
          url: playable.blobUrl,
          format: playable.format
        });
      }

      renderPlaylist();
      currentIndex = 0;
      await loadTrack(currentIndex, false);
      setStatus('Файл загружен. Нажмите ▶️');
    });

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      playlist.forEach((item, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${item.name}</span><span class="small">${idx+1}/${playlist.length}</span>`;
        li.addEventListener('click', () => { currentIndex = idx; loadTrack(currentIndex, true); });
        if (idx === currentIndex) li.classList.add('active');
        playlistEl.appendChild(li);
      });
    }

    async function loadTrack(index, autoplay = false) {
      const item = playlist[index]; if (!item) return;
      audio.src = item.url || '';
      audio.muted = false;
      audio.volume = Math.max(0.01, parseFloat(volumeControl.value || '1'));

      trackTitle.textContent = item.originalName || item.name || '—';
      trackArtist.textContent = '—';
      [...playlistEl.children].forEach((li, i) => li.classList.toggle('active', i === index));

      // Обложка: дефолт
      coverImg.src = 'cover.jpg';

      try {
        await audio.play();
        playBtn.classList.add('active'); playBtn.textContent = '⏸️'; equalizer.style.opacity = 1;
        setStatus('');
        if (!autoplay) { audio.pause(); playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3; }
      } catch (err) {
        // Если автоплей заблокирован — просто ждём нажатия ▶️
        playBtn.classList.remove('active'); playBtn.textContent = '▶️'; equalizer.style.opacity = 0.3;
        if (autoplay) setStatus('Нажмите ▶️ для старта (политика автоплея).');
      }
    }

    // ======= Голосовой помощник (молчаливый) =======
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    voiceToggle.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceToggle.style.background = voiceEnabled ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)';
      voiceIndicator.textContent = voiceEnabled ? 'Голос: включён' : 'Голос: ожидание';
      if (voiceEnabled) startListening(); else stopListening();
    });

    function startListening() {
      if (!SpeechRecognition) { setStatus('ASR не поддерживается этим браузером.'); return; }
      if (recognition) stopListening();
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.interimResults = false;
      recognition.continuous = true;

      recognition.onstart = () => voiceIndicator.innerHTML = '<span class="listening">Голос: слушаю…</span>';
      recognition.onend = () => { if (voiceEnabled) recognition.start(); else voiceIndicator.textContent = 'Голос: ожидание'; };
      recognition.onerror = (e) => { voiceIndicator.textContent = 'Голос: ошибка'; console.warn('ASR error:', e); };

      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).pop()[0].transcript.trim().toLowerCase();
        voiceIndicator.textContent = `Голос: "${transcript}"`;
        handleVoiceCommand(transcript);
      };

      recognition.start();
    }
    function stopListening() {
      if (recognition) { recognition.onend = null; recognition.stop(); recognition = null; }
      voiceIndicator.textContent = 'Голос: ожидание';
    }

    function handleVoiceCommand(cmd) {
      const numMatch = cmd.match(/\d+/);
      const num = numMatch ? parseInt(numMatch[0], 10) : null;

      if (/(пауза|стоп)/.test(cmd)) { audio.pause(); playBtn.classList.remove('active'); playBtn.textContent='▶️'; equalizer.style.opacity = 0.3; return; }
      if (/(воспроизведи|проиграй|продолжи|запусти|play)/.test(cmd)) {
        if (!audio.src && playlist.length){ loadTrack(0,true); }
        else { audio.play().catch(()=>{}); playBtn.classList.add('active'); playBtn.textContent='⏸️'; equalizer.style.opacity = 1; }
        return;
      }
      if (/следующ(ий|е)/.test(cmd)) { playNext(); return; }
      if (/предыдущ(ий|е)/.test(cmd)) { playPrev(); return; }

      if (/(громче|увеличь громкость)/.test(cmd)) { audio.volume = Math.min(1, audio.volume + 0.1); volumeControl.value = audio.volume; return; }
      if (/(тише|уменьш(и|ь) громкость)/.test(cmd)) { audio.volume = Math.max(0, audio.volume - 0.1); volumeControl.value = audio.volume; return; }
      if (/громк(ость)? \d+/.test(cmd) && num !== null) { const v = Math.max(0, Math.min(1, num/100)); audio.volume = v; volumeControl.value = v; return; }

      if (/(перемотай|перемотка|перемотать|вперёд)/.test(cmd) && num) { audio.currentTime = Math.min(audio.currentTime + num, audio.duration || 0); return; }
      if (/(назад|отмотай)/.test(cmd) && num) { audio.currentTime = Math.max(audio.currentTime - num, 0); return; }

      if (/(перемешивание|перемешай|shuffle) включ(и|ить)/.test(cmd)) { shuffle = true; shuffleBtn.style.background='rgba(255,255,255,0.5)'; return; }
      if (/(перемешивание|shuffle) выключ(и|ить)/.test(cmd)) { shuffle = false; shuffleBtn.style.background='rgba(255,255,255,0.15)'; return; }

      if (/повтор (все|всё|all)/.test(cmd)) { repeat='all'; repeatBtn.textContent='🔂'; repeatBtn.style.background='rgba(255,255,255,0.5)'; return; }
      if (/повтор (один|one|трек)/.test(cmd)) { repeat='one'; repeatBtn.textContent='🔁1'; repeatBtn.style.background='rgba(255,255,255,0.5)'; return; }
      if (/повтор выключ(и|ить)/.test(cmd)) { repeat='none'; repeatBtn.textContent='🔁'; repeatBtn.style.background='rgba(255,255,255,0.15)'; return; }

      if (/трек номер \d+/.test(cmd) && num) { const idx = Math.max(1, Math.min(playlist.length, num)) - 1; currentIndex = idx; loadTrack(currentIndex, true); return; }
      // Нераспознанные — игнор
    }

    function formatTime(sec) { const m = Math.floor(sec / 60) || 0; const s = Math.floor(sec % 60) || 0; return `${m}:${s.toString().padStart(2,'0')}`; }
    function setStatus(text){ statusEl.textContent = text || ''; }
  </script>
</body>
</html>
