<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liquid Glass Music — Roman</title>
<meta name="theme-color" content="#0f141b" />
<style>
:root {
  --bg1: #0f141b;
  --bg2: #172130;
  --text: #ffffff;
  --muted: #b7c0cc;
  --accent: #4cafef;
  --accent-2: #7fd1ff;
  --glass-opacity: 0.10;
  --glass-border: 0.16;
  --shadow-outer: 0 34px 90px rgba(0,0,0,0.45);
  --shadow-inner: inset 0 1px 0 rgba(255,255,255,0.10);
}
body.light {
  --bg1: #fdfdfd;
  --bg2: #f5f7fa;
  --text: #0f1318;
  --muted: #4a596b;
  --accent: #225a8a;
  --accent-2: #3b78a8;
  --glass-border: 0.20;
  --shadow-outer: 0 34px 90px rgba(0,0,0,0.25);
  --shadow-inner: inset 0 1px 0 rgba(255,255,255,0.12);
  background: radial-gradient(circle at 50% 20%, 
    rgba(255,255,255,1) 0%, 
    rgba(255,255,255,0.85) 30%, 
    rgba(245,247,250,0.9) 60%, 
    rgba(230,235,240,1) 100%);
  color: var(--text);
}
body, body.light { text-shadow: 0 1px 2px rgba(0,0,0,0.15); }

.glass {
  background: rgba(255,255,255,var(--glass-opacity));
  border: 1px solid rgba(255,255,255,var(--glass-border));
  border-radius: 16px;
  -webkit-backdrop-filter: blur(18px) saturate(165%);
  backdrop-filter: blur(18px) saturate(165%);
  box-shadow: var(--shadow-outer), var(--shadow-inner);
}
.icon-btn {
  width: 52px; height: 52px;
  display: grid; place-items: center;
  font-size: 22px; cursor: pointer; border-radius: 16px;
  border: 1px solid rgba(255,255,255,var(--glass-border));
  background: rgba(255,255,255,calc(var(--glass-opacity) + 0.02));
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 22px 60px rgba(0,0,0,0.34), var(--shadow-inner);
}
.icon-btn:hover { transform: translateY(-1px); border-color: var(--accent-2); }

.app {
  width: min(1180px, 95vw);
  height: min(760px, 94vh);
  margin: 16px auto;
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  grid-template-rows: 64px 1fr 110px;
  grid-template-areas:
    "sidebar header settings"
    "sidebar center  settings"
    "sidebar controls settings";
  gap: 14px;
}

/* Sidebar */
.sidebar { grid-area: sidebar; padding: 12px; display: grid; grid-template-rows: auto 1fr; gap: 10px; }
.sidebar-title { font-weight: 700; }
.library { padding: 10px; overflow: auto; display: grid; gap: 10px; }
.lib-item { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; cursor: pointer; }
.lib-item:hover { transform: translateY(-1px); border-color: var(--accent-2); }
.cover-sm { width: 52px; height: 52px; border-radius: 12px; background: radial-gradient(60% 60% at 40% 30%, #2a3c49, #0f141b); display: grid; place-items: center; font-size: 20px; }

/* Settings */
.settings { grid-area: settings; position: relative; padding: 10px; display: grid; justify-items: end; gap: 10px; }
#settingsBtn { justify-self: end; }
.settings-panel { position: absolute; top: 68px; right: 10px; width: 320px; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .5s ease, opacity .35s ease, padding .25s ease; padding: 0; z-index: 10; }
.settings-panel.open { max-height: 360px; opacity: 1; padding: 12px; }
.settings-grid { display: grid; gap: 10px; }
.set-btn { padding: 10px; border-radius: 12px; cursor: pointer; }

/* Center */
.center { grid-area: center; display: grid; place-items: center; padding: 16px; }
.now-card { width: min(640px, 72%); display: grid; gap: 14px; padding: 16px; }
.cover { width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; background: radial-gradient(80% 80% at 45% 35%, #2a3c49, #0f141b); display: grid; place-items: center; font-size: 56px; overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: none; }
.now-title { font-weight: 800; font-size: clamp(18px,3.2vw,26px); text-align: center; }
.now-meta { color: var(--muted); text-align: center; }

/* Controls */
.controls { grid-area: controls; padding: 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.progress { height: 10px; border-radius: 10px; overflow: hidden; }
.progress .bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .1s linear; }
.ctrl-row { display:flex; align-items:center; justify-content:center; gap:10px; }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="glass sidebar">
    <div class="sidebar-title">Библиотека</div>
    <div id="library" class="glass library"></div>
  </aside>

  <!-- Header -->
  <header class="glass header">
    <div class="icon-btn" title="Главная">🎵</div>
    <div class="icon-btn" title="Эквалайзер">🎚</div>
  </header>

  <!-- Settings -->
  <section class="settings">
    <div id="settingsBtn" class="icon-btn glass" title="Настройки">⚙️</div>
    <div id="settingsPanel" class="glass settings-panel">
      <div class="settings-grid">
        <button id="themeToggle" class="set-btn glass">🌗 Сменить тему</button>
        <label class="set-btn glass" style="display:grid; gap:8px;">
          <span>Прозрачность стекла</span>
          <input id="opacitySlider" type="range" min="0.05" max="0.30" step="0.01" value="0.10" />
        </label>
        <div class="set-btn glass" style="display:grid; gap:8px;">
          <span>Добавить трек по ссылке</span>
          <input id="urlTitle" type="text" placeholder="Название трека" />
          <input id="urlInput" type="url" placeholder="Ссылка на аудио (https://…)" />
          <button id="addByUrl">➕ Добавить</button>
        </div>
        <div class="set-btn glass" style="display:grid; gap:8px;">
          <span>Добавить трек файлом</span>
          <input id="fileInput" type="file" accept="audio/*" />
        </div>
      </div>
    </div>
  </section>

  <!-- Center -->
  <main class="glass center">
    <div class="glass now-card">
      <div class="cover">
        <img id="coverImg
