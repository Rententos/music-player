<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Музыкальная Библиотека</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      transition: background 0.5s, color 0.5s;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    body.light {
      background: linear-gradient(135deg, #f0f0f0, #dcdcdc);
      color: #222;
    }
    .container {
      width: 90%;
      max-width: 800px;
      margin-top: 30px;
    }
    h1 {
      text-align: center;
      padding: 20px;
    }
    #controls {
      text-align: center;
      margin: 20px 0;
    }
    button {
      background: rgba(255,255,255,0.15);
      border: none;
      padding: 8px 16px;
      margin: 5px;
      border-radius: 12px;
      cursor: pointer;
      color: inherit;
      backdrop-filter: blur(8px);
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }
    input {
      padding: 6px;
      border-radius: 8px;
      border: none;
      margin: 5px;
      backdrop-filter: blur(6px);
    }
    #playlist {
      list-style: none;
      padding: 0;
      margin: 20px auto;
    }
    #playlist li {
      background: rgba(255,255,255,0.1);
      margin: 8px 0;
      padding: 14px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      transition: transform 0.3s, background 0.3s;
    }
    #playlist li:hover {
      transform: translateX(5px);
      background: rgba(255,255,255,0.2);
    }
    #visualizer {
      width: 100%;
      height: 120px;
      background: rgba(255,255,255,0.05);
      margin-top: 20px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    .bar {
      width: 10px;
      margin: 2px;
      background: #4cafef;
      height: 20px;
      transition: height 0.1s;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎶 Моя Музыкальная Библиотека</h1>

    <div id="controls">
      <audio id="audio" controls></audio><br>
      <input type="text" id="trackTitle" placeholder="Название трека">
      <input type="text" id="trackUrl" placeholder="Ссылка на mp3">
      <button onclick="addTrack()">Добавить трек</button>
      <button onclick="toggleTheme()">Сменить тему</button>
      <button onclick="setSleepTimer()">Таймер сна</button>
    </div>

    <ul id="playlist"></ul>

    <div id="visualizer"></div>
  </div>

  <script>
    let playlist = loadPlaylist();
    const audio = document.getElementById("audio");
    const playlistEl = document.getElementById("playlist");
    const visualizer = document.getElementById("visualizer");
    let sleepTimer;

    renderPlaylist();

    function savePlaylist() {
      localStorage.setItem("myPlaylist", JSON.stringify(playlist));
    }
    function loadPlaylist() {
      const data = localStorage.getItem("myPlaylist");
      return data ? JSON.parse(data) : [];
    }

    function addTrack() {
      const title = document.getElementById("trackTitle").value.trim();
      const url = document.getElementById("trackUrl").value.trim();
      if (title && url) {
        playlist.push({ title, url });
        savePlaylist();
        renderPlaylist();
        document.getElementById("trackTitle").value = "";
        document.getElementById("trackUrl").value = "";
      }
    }

    function playTrack(index) {
      if (audio.src) {
        crossfade(playlist[index].url);
      } else {
        audio.src = playlist[index].url;
        audio.play();
      }
    }

    function deleteTrack(index) {
      playlist.splice(index, 1);
      savePlaylist();
      renderPlaylist();
    }

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      playlist.forEach((track, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${track.title}</span>
          <div>
            <button onclick="playTrack(${index})">▶️</button>
            <button onclick="deleteTrack(${index})">🗑️</button>
          </div>
        `;
        playlistEl.appendChild(li);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    function setSleepTimer() {
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(() => {
        audio.pause();
        alert("⏱️ Таймер сна: воспроизведение остановлено");
      }, 60000);
    }

    function crossfade(newSrc) {
      const oldAudio = audio;
      const tempAudio = new Audio(newSrc);
      tempAudio.volume = 0;
      tempAudio.play();

      let fadeOut = setInterval(() => {
        if (oldAudio.volume > 0.05) {
          oldAudio.volume -= 0.05;
        } else {
          clearInterval(fadeOut);
          oldAudio.pause();
          oldAudio.src = newSrc;
          oldAudio.volume = 1;
          oldAudio.play();
        }
      }, 200);

      let fadeIn = setInterval(() => {
        if (tempAudio.volume < 1) {
          tempAudio.volume += 0.05;
        } else {
          clearInterval(fadeIn);
          tempAudio.pause();
        }
      }, 200);
    }

    for (let i = 0; i < 40; i++) {
      const bar = document.createElement("div");
      bar.className = "bar";
      visualizer.appendChild(bar);
    }
    const bars = document.querySelectorAll(".bar");

    function animateVisualizer() {
      bars.forEach(bar => {
        bar.style.height = Math.random() * 120 + "px";
      });
      requestAnimationFrame(animateVisualizer);
    }
    animateVisualizer();

    document.addEventListener("keydown", e => {
      if (e.code === "Space") {
        e.preventDefault();
        audio.paused ? audio.play() : audio.pause();
      }
      if (e.code === "ArrowRight") {
        audio.currentTime += 5;
      }
      if (e.code === "ArrowLeft") {
        audio.currentTime -= 5;
      }
    });
  </script>
</body>
</html>
