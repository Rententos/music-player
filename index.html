<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Музыкальная Библиотека</title>
  <meta name="theme-color" content="#203a43">
  <style>
    /* Базовая стабильность и доступность */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    :focus-visible { outline: 2px solid #4cafef; outline-offset: 2px; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      transition: background 0.4s ease, color 0.4s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    body.light {
      background: linear-gradient(135deg, #f6f7f9, #e9eaed);
      color: #222;
    }
    @media (prefers-color-scheme: light) {
      body:not(.dark) { background: linear-gradient(135deg, #f6f7f9, #e9eaed); color: #222; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 28px auto;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      padding: 12px 0;
    }

    /* Панель управления */
    #controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      justify-items: center;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 12px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      width: 100%;
      max-width: 900px;
    }
    input, button { font: inherit; }
    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: inherit;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.8); }
    body.light input::placeholder { color: #666; }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: rgba(255,255,255,0.18);
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      color: inherit;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.15s;
    }
    button:hover { background: rgba(255,255,255,0.30); transform: translateY(-1px); }

    /* Основная зона: сетка Плейлист + Визуализатор */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    /* Плейлист */
    #playlist {
      list-style: none;
      padding: 10px;
      margin: 0;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 14px;
    }
    #playlist[aria-busy="true"] { opacity: 0.6; }
    #playlist li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 12px;
      margin: 8px 0;
      transition: background 0.2s, transform 0.2s;
    }
    #playlist li:hover { background: rgba(255,255,255,0.18); transform: translateX(3px); }
    #playlist li.dragging { opacity: 0.5; }
    .track-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-actions { display: flex; gap: 8px; }

    /* Визуализатор */
    #visualizer {
      height: 280px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
    }
    .bar {
      width: 9px;
      margin: 2px;
      background: #4cafef;
      height: 24px;
      transition: height 0.12s;
      border-radius: 4px;
    }

    /* Адаптивность */
    @media (max-width: 900px) {
      .inputs { grid-template-columns: 1fr; }
      .main { grid-template-columns: 1fr; }
      #visualizer { height: 180px; }
      #playlist li { grid-template-columns: 1fr; }
      .track-actions { justify-content: flex-start; }
    }
    @media (max-width: 520px) {
      button { padding: 9px 12px; border-radius: 10px; }
      input { padding: 9px; }
      .bar { width: 7px; margin: 2px; }
      #visualizer { height: 160px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="app-title">🎶 Моя Музыкальная Библиотека</h1>

    <div id="controls" role="region" aria-labelledby="app-title">
      <!-- Два аудиоканала для стабильного кроссфейда -->
      <audio id="audioA" crossorigin="anonymous"></audio>
      <audio id="audioB" crossorigin="anonymous"></audio>

      <div class="inputs" role="form" aria-label="Добавить трек">
        <input type="text" id="trackTitle" placeholder="Название трека" aria-label="Название трека">
        <input type="url" id="trackUrl" placeholder="Ссылка на mp3 (https://...)" aria-label="Ссылка на трек">
        <button id="addBtn" aria-label="Добавить трек">Добавить трек</button>
      </div>

      <div class="buttons" role="group" aria-label="Управление">
        <button id="playPauseBtn" aria-label="Плей/Пауза">Плей/Пауза</button>
        <button id="themeBtn" aria-label="Сменить тему">Сменить тему</button>
        <button id="sleepBtn" aria-label="Таймер сна 1 мин">Таймер сна 1 мин</button>
        <button id="clearBtn" aria-label="Очистить плейлист">Очистить плейлист</button>
        <button id="exportBtn" aria-label="Экспорт плейлиста">Экспорт</button>
        <button id="importBtn" aria-label="Импорт плейлиста">Импорт</button>
      </div>
    </div>

    <div class="main">
      <ul id="playlist" role="list" aria-label="Список треков"></ul>
      <div id="visualizer" role="img" aria-label="Аудио визуализатор"></div>
    </div>
  </div>

  <script>
    // Состояние
    const audioA = document.getElementById('audioA');
    const audioB = document.getElementById('audioB');
    let active = 'A'; // какой канал активен сейчас
    let sleepTimer = null;

    const playlistEl = document.getElementById('playlist');
    const visualizer = document.getElementById('visualizer');

    // Инициализация
    let playlist = loadPlaylist();
    applySavedTheme();
    renderPlaylist();
    setupControls();
    (window.requestIdleCallback || setTimeout)(initVisualizer, 0);
    setupPWA();

    // Сохранение/загрузка
    function savePlaylist() {
      localStorage.setItem('myPlaylist', JSON.stringify(playlist));
    }
    function loadPlaylist() {
      try {
        const data = localStorage.getItem('myPlaylist');
        return data ? JSON.parse(data) : [];
      } catch {
        return [];
      }
    }

    // Тема
    function applySavedTheme() {
      const theme = localStorage.getItem('theme');
      if (theme === 'light') document.body.classList.add('light');
    }
    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    // Добавление трека
    function addTrack() {
      const titleEl = document.getElementById('trackTitle');
      const urlEl = document.getElementById('trackUrl');
      const title = titleEl.value.trim();
      const url = urlEl.value.trim();
      if (!title || !url) return alert('Укажи название и ссылку.');
      if (!/^https?:\/\//i.test(url)) return alert('Ссылка должна начинаться с http:// или https://');
      if (playlist.some(t => t.url === url)) return alert('Этот трек уже в плейлисте.');

      playlist.push({ title, url });
      savePlaylist();
      renderPlaylist();
      titleEl.value = '';
      urlEl.value = '';
    }

    // Рендер плейлиста
    function renderPlaylist() {
      playlistEl.setAttribute('aria-busy', 'true');
      playlistEl.innerHTML = '';
      playlist.forEach((track, index) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.index = index;

        const title = document.createElement('span');
        title.className = 'track-title';
        title.textContent = track.title;

        const actions = document.createElement('div');
        actions.className = 'track-actions';

        const playBtn = document.createElement('button');
        playBtn.textContent = '▶️';
        playBtn.setAttribute('aria-label', 'Проиграть трек');
        playBtn.onclick = () => playTrack(index);

        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑️';
        delBtn.setAttribute('aria-label', 'Удалить трек');
        delBtn.onclick = () => { playlist.splice(index, 1); savePlaylist(); renderPlaylist(); };

        actions.appendChild(playBtn);
        actions.appendChild(delBtn);

        li.appendChild(title);
        li.appendChild(actions);

        // Drag & Drop сортировка
        li.addEventListener('dragstart', (e) => {
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', index.toString());
        });
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.addEventListener('dragover', (e) => {
          e.preventDefault();
          const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const toIndex = parseInt(li.dataset.index, 10);
          if (fromIndex === toIndex) return;
          const rect = li.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          const after = e.clientY > mid;
          const fromEl = playlistEl.children[fromIndex];
          if (!fromEl) return;
          playlistEl.insertBefore(fromEl, after ? li.nextSibling : li);
        });
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const toIndex = parseInt(li.dataset.index, 10);
          moveItem(fromIndex, toIndex);
        });

        playlistEl.appendChild(li);
      });
      playlistEl.removeAttribute('aria-busy');
      Array.from(playlistEl.children).forEach((child, idx) => child.dataset.index = idx);
    }

    function moveItem(from, to) {
      if (from === to) return;
      const item = playlist.splice(from, 1)[0];
      playlist.splice(to, 0, item);
      savePlaylist();
      renderPlaylist();
    }

    // Проигрывание трека с кроссфейдом
    async function playTrack(index) {
      const track = playlist[index];
      if (!track) return;

      const from = active === 'A' ? audioA : audioB;
      const to = active === 'A' ? audioB : audioA;

      try {
        to.src = track.url;
        to.volume = 0;
        await to.play();

        // Плавный кроссфейд
        const step = 0.05;
        const interval = 120;
        const fade = setInterval(() => {
          from.volume = Math.max(0, from.volume - step);
          to.volume = Math.min(1, to.volume + step);

          if (from.volume <= 0 && to.volume >= 1) {
            clearInterval(fade);
            from.pause();
            active = active === 'A' ? 'B' : 'A';
          }
        }, interval);
      } catch (e) {
        alert('Не удалось проиграть трек. Проверь ссылку.');
      }
    }

    // Кнопки управления
    function setupControls() {
      document.getElementById('addBtn').onclick = addTrack;
      document.getElementById('themeBtn').onclick = toggleTheme;
      document.getElementById('sleepBtn').onclick = () => setSleepTimer(60_000);
      document.getElementById('clearBtn').onclick = () => {
        if (confirm('Очистить плейлист?')) {
          playlist = [];
          savePlaylist();
          renderPlaylist();
        }
      };
      document.getElementById('playPauseBtn').onclick = togglePlayPause;

      document.getElementById('exportBtn').onclick = exportPlaylist;
      document.getElementById('importBtn').onclick = importPlaylist;

      // Горячие клавиши
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayPause();
        } else if (e.code === 'ArrowRight') {
          currentAudio().currentTime += 5;
        } else if (e.code === 'ArrowLeft') {
          currentAudio().currentTime -= 5;
        }
      });
    }

    function currentAudio() {
      return active === 'A' ? audioA : audioB;
    }

    function togglePlayPause() {
      const a = currentAudio();
      if (a.src) {
        a.paused ? a.play() : a.pause();
      } else {
        if (playlist.length) playTrack(0);
      }
    }

    // Таймер сна
    function setSleepTimer(ms) {
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(() => {
        audioA.pause();
        audioB.pause();
        alert('⏱️ Таймер сна: воспроизведение остановлено');
      }, ms);
      alert('Таймер сна установлен');
    }

    // Экспорт/Импорт плейлиста
    function exportPlaylist() {
      const blob = new Blob([JSON.stringify(playlist, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'playlist.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    async function importPlaylist() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('Неверный формат');
          // простая валидация
          const cleaned = data.filter(t => t && t.title && t.url && /^https?:\/\//i.test(t.url));
          playlist = cleaned;
          savePlaylist();
          renderPlaylist();
          alert('Импорт завершён');
        } catch {
          alert('Ошибка импорта. Проверь файл.');
        }
      };
      input.click();
    }

    // Визуализатор (адаптивный, экономный)
    let resizeObserver;
    function initVisualizer() {
      visualizer.innerHTML = '';
      const barsCount = Math.floor(visualizer.clientWidth / 14);
      for (let i = 0; i < Math.max(24, barsCount); i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        visualizer.appendChild(bar);
      }
      const bars = Array.from(visualizer.querySelectorAll('.bar'));

      function animate() {
        const base = currentAudio();
        const amp = base.paused ? 0.15 : 1;
        for (let i = 0; i < bars.length; i++) {
          const r = Math.random() * amp;
          const h = 40 + r * (visualizer.clientHeight - 60);
          bars[i].style.height = Math.max(20, Math.min(visualizer.clientHeight - 20, h)) + 'px';
        }
        requestAnimationFrame(animate);
      }
      animate();

      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver(debounce(() => initVisualizer(), 200));
      resizeObserver.observe(visualizer);
    }

    // Вспомогательное: debounce
    function debounce(fn, delay) {
      let t = null;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
      };
    }

    // PWA: динамический манифест и сервис-воркер из одного файла
    function setupPWA() {
      // Иконки как data URI (простые цветные квадраты)
      const icon192 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" fill="#203a43"/><text x="50%" y="55%" font-size="72" text-anchor="middle" fill="#ffffff">🎵</text></svg>');
      const icon512 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="#203a43"/><text x="50%" y="55%" font-size="192" text-anchor="middle" fill="#ffffff">🎵</text></svg>');

      const manifest = {
        name: 'Моя Музыкальная Библиотека',
        short_name: 'Музыка',
        start_url: '.',
        display: 'standalone',
        background_color: '#203a43',
        theme_color: '#203a43',
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/svg+xml' },
          { src: icon512, sizes: '512x512', type: 'image/svg+xml' }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      // Сервис-воркер: кэширует страницу и манифест
      const swCode = `
        const CACHE = 'music-lib-v1';
        const ASSETS = [
          './',
          './index.html'
        ];
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE && caches.delete(k))))
          );
        });
        self.addEventListener('fetch', (e) => {
          const { request } = e;
          if (request.mode === 'navigate') {
            e.respondWith(
              fetch(request).catch(() => caches.match('./index.html'))
            );
            return;
          }
          e.respondWith(
            fetch(request)
              .then(resp => {
                const copy = resp.clone();
                caches.open(CACHE).then(c => c.put(request, copy));
                return resp;
              })
              .catch(() => caches.match(request))
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(swUrl).catch(()=>{});
      }
    }
  </script>
</body>
</html>
